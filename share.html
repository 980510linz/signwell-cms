/* ============================================================
   SIGN WELL · 欣緯生醫
   Liquid-glass UI system
   ============================================================ */

@property --rim{syntax:'<angle>';inherits:true;initial-value:140deg}

:root{
  /* palette */
  --sky:#77b9f6; --sky-deep:#4f97dd; --sky2:#b9ddff; --sky3:#e9f6ff;
  --ink:#17212d; --muted:#6f7f91; --bg:#edf6fc;

  /* glass system */
  --glass-tint-a:rgba(255,255,255,.62);
  --glass-tint-b:rgba(240,250,255,.26);
  --glass-rim:rgba(255,255,255,.92);
  --glass-rim-soft:rgba(255,255,255,.34);
  --glass-blur:30px;
  --glass-sat:180%;
  --glass-inner:inset 0 1px 0 rgba(255,255,255,.96), inset 0 -1px 0 rgba(82,131,171,.07);
  --shadow-soft:0 2px 8px rgba(60,94,128,.05);
  --shadow-lift:0 30px 84px rgba(72,123,165,.16), 0 8px 26px rgba(60,94,128,.07);
  --shadow-hover:0 44px 104px rgba(58,108,150,.20), 0 10px 30px rgba(60,94,128,.10);

  /* motion */
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);

  --rail-x:max(12px,env(safe-area-inset-left));
  --radius-xl:36px; --radius-lg:28px; --radius-md:20px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(255,255,255,.85), transparent 60%),
    linear-gradient(155deg,#f9fcff 0%,#edf6fc 46%,#e5f0f8 100%);
  background-attachment:fixed;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit}
button{color:inherit;overflow:hidden}
::selection{background:rgba(119,185,246,.30);color:#0f2233}
:focus-visible{outline:2px solid var(--sky-deep);outline-offset:3px;border-radius:10px}

/* slim scrollbar */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:rgba(110,158,196,.32);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(94,146,190,.55);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- ambient background ---------- */
.ambient{position:fixed;inset:-22%;z-index:-3;pointer-events:none;filter:blur(76px) saturate(135%);opacity:.9;will-change:transform}
.orb{position:absolute;border-radius:50%;will-change:transform}
.orb.a{width:44vmax;height:44vmax;left:0;top:2%;background:radial-gradient(circle,rgba(101,181,252,.36),transparent 67%);animation:floatA 24s ease-in-out infinite alternate}
.orb.b{width:36vmax;height:36vmax;right:4%;top:16%;background:radial-gradient(circle,rgba(195,225,255,.58),transparent 67%);animation:floatB 30s ease-in-out infinite alternate}
.orb.c{width:48vmax;height:48vmax;left:22%;bottom:-16%;background:radial-gradient(circle,rgba(167,228,226,.30),transparent 66%);animation:floatC 34s ease-in-out infinite alternate}
.orb.d{width:28vmax;height:28vmax;right:16%;bottom:6%;background:radial-gradient(circle,rgba(148,196,255,.24),transparent 68%);animation:floatB 27s ease-in-out infinite alternate-reverse}
@keyframes floatA{to{transform:translate(7%,6%) scale(1.12)}}
@keyframes floatB{to{transform:translate(-7%,-5%) scale(.94)}}
@keyframes floatC{to{transform:translate(-7%,-5%) scale(1.11)}}

.grain{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.2;
  background-image:radial-gradient(rgba(35,71,101,.11) .45px,transparent .55px);background-size:18px 18px;
  -webkit-mask-image:linear-gradient(#000,transparent 82%);mask-image:linear-gradient(#000,transparent 82%)}

/* cursor spotlight (fine pointers only) */
.cursor-glow{position:fixed;top:0;left:0;width:340px;height:340px;margin:-170px 0 0 -170px;z-index:-1;pointer-events:none;
  border-radius:50%;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(circle,rgba(146,203,255,.34),rgba(146,203,255,.10) 42%,transparent 68%);
  filter:blur(14px);will-change:transform}
body.has-pointer .cursor-glow{opacity:1}

/* ---------- the glass material ---------- */
.glass{
  position:relative;
  background:linear-gradient(145deg,var(--glass-tint-a),var(--glass-tint-b));
  box-shadow:var(--glass-inner),var(--shadow-lift);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  isolation:isolate;
}
/* refractive rim: a gradient border drawn with mask-composite */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(150deg,var(--glass-rim) 0%,var(--glass-rim-soft) 32%,rgba(255,255,255,.18) 55%,var(--glass-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(240,249,255,.82))}
}

/* light that follows the pointer across a card */
.lightcard::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(420px circle at var(--px,50%) var(--py,20%),rgba(255,255,255,.78),rgba(255,255,255,.10) 42%,transparent 62%);
  opacity:.5;transition:opacity .35s ease;mix-blend-mode:screen;
}
.lightcard:hover::after{opacity:.85}
.card3d.lightcard::after{mix-blend-mode:normal;opacity:.4}
.card3d.lightcard:hover::after{opacity:.62}

/* diagonal sheen sweep on hover */
.sheen{overflow:hidden}
.sheen > .sheen-layer{
  content:"";position:absolute;inset:-40% -60%;z-index:1;pointer-events:none;
  background:linear-gradient(78deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);
  transform:translateX(-120%) rotate(2deg);opacity:0;
}
.sheen:hover > .sheen-layer{animation:sweep .95s var(--ease) forwards}
@keyframes sweep{0%{transform:translateX(-120%) rotate(2deg);opacity:0}18%{opacity:.9}100%{transform:translateX(120%) rotate(2deg);opacity:0}}


/* ---------- 3D stage (perspective + light + cast shadow) ---------- */
.stage3d{position:relative;width:100%;display:grid;place-items:center;
  perspective:1100px;perspective-origin:50% 45%;touch-action:pan-y}
.stage-glow{position:absolute;inset:4% 2%;border-radius:90px;pointer-events:none;z-index:0;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,45%),rgba(255,255,255,.6),transparent 62%);
  filter:blur(36px);transition:background .18s ease-out}
.stage-shadow{position:absolute;left:9%;right:9%;bottom:-5%;height:15%;border-radius:50%;pointer-events:none;z-index:0;
  background:rgba(74,124,165,.38);filter:blur(40px);opacity:.55;
  transform:translate3d(var(--sx,0px),var(--sy,0px),-90px);transition:transform .18s ease-out}
.tilt-wrap{position:relative;width:100%;transform-style:preserve-3d;will-change:transform;
  transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) translateZ(0)}

/* a card whose children really sit at different depths: the blur lives on
   its own plate so the card itself never becomes a flattening group */
.card3d{position:relative;transform-style:preserve-3d;background:none;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.glass-plate{position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;
  background:linear-gradient(145deg,var(--glass-tint-a),var(--glass-tint-b));
  box-shadow:var(--glass-inner),var(--shadow-lift);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat))}
.glass-plate::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,var(--glass-rim) 0%,var(--glass-rim-soft) 32%,rgba(255,255,255,.18) 55%,var(--glass-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

/* edge lighting: the lit rim follows the tilt, the opposite edge darkens */
.edge-light{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.26),
    inset var(--ex,0px) var(--ey,0px) 36px -12px rgba(255,255,255,.82),
    inset calc(var(--ex,0px) * -1) calc(var(--ey,0px) * -1) 32px -14px rgba(48,92,132,.22);
  transition:box-shadow .18s ease-out}

/* depth layers */
.lift1{transform:translateZ(24px)}
.lift2{transform:translateZ(44px)}
.lift3{transform:translateZ(66px)}
.lift1,.lift2,.lift3{transform-style:preserve-3d}

/* ---------- QR: no long-press save ---------- */
.qr-stack{position:relative;display:inline-grid;place-items:center;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.qr-box{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.qr-box img,.qr-box canvas{pointer-events:none;-webkit-user-drag:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.qr-shield{position:absolute;inset:-6px;border-radius:34px;z-index:8;display:block;
  background:transparent;touch-action:manipulation;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.qr-note{margin-top:12px;font-size:10px;color:#8299aa;text-align:center;letter-spacing:.02em}
body.dark .stage-glow{background:radial-gradient(circle at var(--gx,50%) var(--gy,45%),rgba(150,205,255,.22),transparent 62%)}
body.dark .stage-shadow{background:rgba(0,0,0,.6)}
body.dark .edge-light{box-shadow:
  inset 0 0 0 1px rgba(186,222,252,.16),
  inset var(--ex,0px) var(--ey,0px) 36px -12px rgba(196,229,255,.38),
  inset calc(var(--ex,0px) * -1) calc(var(--ey,0px) * -1) 32px -14px rgba(0,0,0,.45)}
body.dark .qr-note{color:#8ca0b1}
body.lite .stage-glow,body.lite .stage-shadow{display:none}
@media(max-width:620px){
  .stage3d{perspective:900px}
  .stage-shadow{bottom:-3%;height:12%}
  .lift1{transform:translateZ(14px)}
  .lift2{transform:translateZ(26px)}
  .lift3{transform:translateZ(38px)}
}
@media(prefers-reduced-motion:reduce){
  .tilt-wrap{transform:none!important}
  .lift1,.lift2,.lift3{transform:none!important}
  .edge-light{box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)!important}
}

/* ---------- reading progress ---------- */
#readingProgress{position:fixed;top:0;left:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,#68b5f4,#9fd1ff 55%,#b8e4de);z-index:200;
  box-shadow:0 0 16px rgba(100,180,246,.6);will-change:transform}

/* ---------- page slider · iOS liquid glass ---------- */
.pager{
  position:fixed;left:var(--rail-x);top:50%;transform:translateY(-50%);z-index:120;
  width:68px;height:236px;border-radius:34px;padding:10px 7px;
  touch-action:none;user-select:none;isolation:isolate;cursor:grab;
  background:linear-gradient(152deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 46%,rgba(255,255,255,.14));
  backdrop-filter:blur(26px) saturate(195%) brightness(1.07);
  -webkit-backdrop-filter:blur(26px) saturate(195%) brightness(1.07);
  box-shadow:
    0 28px 62px rgba(56,105,145,.20),
    0 3px 12px rgba(56,105,145,.09),
    inset 0 1px 1px rgba(255,255,255,.72),
    inset 0 -1px 1px rgba(255,255,255,.30);
  transition:box-shadow .4s var(--ease),background .4s var(--ease);
}
.pager.grabbing{cursor:grabbing;box-shadow:0 34px 74px rgba(56,105,145,.26),inset 0 1px 1px rgba(255,255,255,.8)}
/* edge lensing — the bright refracted rim that shifts around the shape */
.pager::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;z-index:5;
  background:conic-gradient(from var(--rim,140deg) at 50% 50%,
    rgba(255,255,255,.96),rgba(255,255,255,.16) 21%,rgba(255,255,255,.88) 47%,
    rgba(255,255,255,.12) 71%,rgba(255,255,255,.96));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
}
/* inner refraction: light pooling just inside the glass wall */
.pager::after{
  content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 14px 2px rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.16);
}

/* the liquid thumb — a lens, not a solid pill */
.pager-thumb{
  position:absolute;z-index:2;left:0;top:0;pointer-events:none;border-radius:27px;
  transform-origin:50% 50%;will-change:transform;
  background:linear-gradient(158deg,rgba(255,255,255,.66),rgba(255,255,255,.20) 54%,rgba(255,255,255,.44));
  backdrop-filter:blur(3px) saturate(215%) brightness(1.18);
  -webkit-backdrop-filter:blur(3px) saturate(215%) brightness(1.18);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.96),
    inset 0 -12px 20px -12px rgba(88,150,202,.55),
    0 12px 24px rgba(56,110,155,.22),
    0 1px 3px rgba(56,110,155,.16);
}
.pager-thumb::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(160deg,rgba(255,255,255,1),rgba(255,255,255,.30) 44%,rgba(255,255,255,.86));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
}
/* specular streak that slides as the thumb accelerates */
.thumb-spec{
  position:absolute;left:14%;right:14%;top:6px;height:9px;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.98),transparent);
  filter:blur(1.5px);opacity:.92;transform:translateY(var(--spec,0px))
}

.pager-items{position:relative;z-index:3;height:100%;display:grid;grid-template-rows:repeat(3,1fr)}
.nav-item{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#8394a5;font-size:10px;font-weight:720;letter-spacing:.03em;min-height:64px;cursor:grab;
  pointer-events:none;border-radius:26px;
  transition:color .3s ease,transform .45s var(--ease-spring),opacity .3s ease;
}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .5s var(--ease-spring)}
.nav-item.active{color:#20506f}
.nav-item.active svg{transform:translateY(-1px) scale(1.1)}
.pager.grabbing .nav-item:not(.active){opacity:.62}

/* ---------- top chrome ---------- */
.brand-top{position:fixed;top:max(18px,env(safe-area-inset-top));left:max(96px,calc(env(safe-area-inset-left) + 96px));z-index:80;
  display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 12px 5px 5px;border-radius:19px;overflow:hidden;
  transition:background .4s var(--ease-soft),box-shadow .4s var(--ease-soft),transform .4s var(--ease)}
.brand-top:hover{transform:translateY(-1px)}
body.is-scrolled .brand-top{background:rgba(255,255,255,.42);box-shadow:0 10px 30px rgba(63,110,148,.10);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.brand-mark{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(214,238,255,.62));border:1px solid rgba(255,255,255,.92);
  box-shadow:inset 0 1px 0 #fff,0 10px 28px rgba(62,111,151,.14);backdrop-filter:blur(18px);
  transition:transform .5s var(--ease-spring)}
.brand-top:hover .brand-mark{transform:rotate(-6deg) scale(1.06)}
.brand-copy strong{display:block;font-size:12px;letter-spacing:.16em}
.brand-copy span{display:block;font-size:10px;color:var(--muted);margin-top:2px}

.top-actions{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:80;display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.88);
  background:linear-gradient(150deg,rgba(255,255,255,.66),rgba(238,249,255,.4));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 26px rgba(63,110,148,.1);
  backdrop-filter:blur(20px) saturate(165%);-webkit-backdrop-filter:blur(20px) saturate(165%);
  cursor:pointer;display:grid;place-items:center;position:relative;overflow:hidden;
  transition:transform .4s var(--ease-spring),box-shadow .3s ease,background .3s ease}
.iconbtn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 16px 34px rgba(63,110,148,.18)}
.iconbtn:active{transform:scale(.9)}

/* ---------- layout ---------- */
#app{min-height:100dvh;padding-left:100px;padding-right:28px;
  padding-top:max(86px,calc(env(safe-area-inset-top) + 72px));
  padding-bottom:max(48px,calc(env(safe-area-inset-bottom) + 32px));
  transition:opacity .16s ease,transform .18s var(--ease)}
#app.page-in-fast{animation:pageInFast .18s var(--ease) both}
@keyframes pageInFast{from{opacity:.72;transform:translateY(5px)}to{opacity:1;transform:none}}

.shell{width:min(1160px,100%);margin:0 auto}

/* ---------- hero ---------- */
.hero{min-height:calc(100dvh - 120px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:52px;align-items:center}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:760;letter-spacing:.14em;color:#5f8fb8}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 5px rgba(119,185,246,.12);
  animation:pulseDot 2.8s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 0 9px rgba(119,185,246,.05)}}
h1{font-size:clamp(44px,7vw,92px);line-height:.98;letter-spacing:-.06em;margin:18px 0 20px;font-weight:760}
.hero h1{background:linear-gradient(105deg,#13202c 12%,#2f5f86 44%,#13202c 78%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:titleSheen 7s ease-in-out 1.1s infinite}
@keyframes titleSheen{0%,72%{background-position:120% 0}100%{background-position:-40% 0}}
.hero-sub{max-width:680px;color:var(--muted);font-size:clamp(15px,1.65vw,19px);line-height:1.85}

.hero-card{border-radius:var(--radius-xl);padding:30px;position:relative;overflow:hidden;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .3s var(--ease),box-shadow .4s ease}
.hero-card b{font-size:22px;line-height:1.4;position:relative;z-index:3}
.hero-card p{color:var(--muted);line-height:1.8;position:relative;z-index:3}
.hero-card .tiny{font-size:11px;color:#7294b1;margin-top:22px;position:relative;z-index:3}

.scroll-cue{display:inline-flex;align-items:center;gap:10px;margin-top:26px;color:#6d8192;font-size:12px;text-decoration:none;
  padding:6px 14px 6px 6px;border-radius:99px;transition:background .3s ease,transform .4s var(--ease)}
.scroll-cue:hover{background:rgba(255,255,255,.5);transform:translateY(2px)}
.scroll-cue i{width:22px;height:34px;border:1px solid rgba(87,125,157,.28);border-radius:12px;position:relative;flex:none}
.scroll-cue i::after{content:"";position:absolute;top:7px;left:50%;width:4px;height:7px;border-radius:99px;background:#77b9f6;
  transform:translateX(-50%);animation:scrollDot 1.8s ease-in-out infinite}
@keyframes scrollDot{50%{transform:translate(-50%,9px);opacity:.35}}

/* ---------- sections & cards ---------- */
.section{padding:44px 0 26px;scroll-margin-top:80px}
.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
.section-head p{margin:0;color:#8290a0;font-size:12px}
.section-head h2{margin:5px 0 0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}
.article-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.article-card{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:16px;min-height:320px;cursor:pointer;
  content-visibility:auto;contain-intrinsic-size:320px;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0));
  transition:transform .32s var(--ease),box-shadow .34s ease}
.article-card:hover{--lift:-5px;box-shadow:var(--glass-inner),var(--shadow-hover)}
.article-card > *{position:relative;z-index:3}
.article-card .edge-light,.topic-card .edge-light,.hero-card .edge-light{z-index:4}
.card-cover{height:155px;border-radius:18px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#dceefd,#f7fbff)}
.card-cover img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease);will-change:transform}
.article-card:hover .card-cover img{transform:scale(1.06)}
.kicker{font-size:10px;color:#6791b1;font-weight:760;letter-spacing:.08em}
.article-card h3{font-size:20px;line-height:1.35;margin:9px 0 8px;letter-spacing:-.025em}
.article-card p{color:var(--muted);font-size:13px;line-height:1.7}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:#91a0ad;font-size:10px;margin-top:15px}
.empty{padding:32px;color:var(--muted);border:1px dashed rgba(86,125,155,.24);border-radius:var(--radius-md);text-align:center;line-height:1.8}

/* skeletons while content loads */
.skeleton{border-radius:var(--radius-lg);min-height:320px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(240,249,255,.3));border:1px solid rgba(255,255,255,.6)}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(100deg,transparent 22%,rgba(255,255,255,.62) 50%,transparent 78%);animation:shimmer 1.6s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skeleton .sk-bar{position:absolute;left:16px;border-radius:10px;background:rgba(122,166,201,.14)}
.skeleton .sk-cover{position:absolute;left:16px;right:16px;top:16px;height:155px;border-radius:18px;background:rgba(122,166,201,.13)}
.skeleton .sk-1{top:196px;width:44%;height:11px}
.skeleton .sk-2{top:220px;width:78%;height:17px}
.skeleton .sk-3{top:252px;width:90%;height:11px}
.skeleton .sk-4{top:272px;width:64%;height:11px}
.skeleton.sk-topic{min-height:210px;border-radius:var(--radius-lg)}
.skeleton.sk-topic .sk-1{top:26px;width:38%}
.skeleton.sk-topic .sk-2{top:76px;width:62%;height:22px}
.skeleton.sk-topic .sk-3{top:118px;width:84%}
.skeleton.sk-line{min-height:0;border-radius:12px}

/* ---------- topics ---------- */
.page-hero{padding:44px 0 36px}
.page-hero h1{font-size:clamp(42px,6vw,76px)}
.page-hero p{max-width:720px;color:var(--muted);font-size:16px;line-height:1.8}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.topic-card{position:relative;border-radius:var(--radius-lg);padding:24px;min-height:210px;cursor:pointer;overflow:hidden;
  transition:transform .34s var(--ease),box-shadow .34s ease}
.topic-card > *{position:relative;z-index:3}
.topic-card:hover{transform:translateY(-5px);box-shadow:var(--glass-inner),var(--shadow-hover)}
.topic-no{font-size:11px;color:#79a2c0}
.topic-card h3{margin:35px 0 8px;font-size:24px;letter-spacing:-.02em}
.topic-card p{color:var(--muted);line-height:1.75;font-size:13px}
.topic-count{margin-top:18px;font-size:11px;color:#648eb0;display:inline-flex;align-items:center;gap:6px;
  transition:gap .3s var(--ease),color .3s ease}
.topic-card:hover .topic-count{gap:11px;color:#3d7aa8}
.topic-detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.backlink{border:0;background:transparent;color:#6687a2;cursor:pointer;padding:6px 12px 6px 0;border-radius:12px;
  transition:transform .3s var(--ease),color .3s ease}
.backlink:hover{color:#37627f;transform:translateX(-3px)}

/* ---------- share ---------- */
.share-wrap{min-height:calc(100dvh - 130px);display:grid;place-items:center;padding:30px 0 46px}
.share-card{width:min(760px,100%);border-radius:var(--radius-xl);padding:34px;position:relative}
.share-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;position:relative;z-index:3}
.share-grid > div:last-child{text-align:center}
.share-card h1{font-size:clamp(38px,5vw,62px);margin:14px 0;letter-spacing:-.05em}
.share-card p{color:var(--muted);line-height:1.8}
.share-url{display:flex;gap:8px;align-items:center;margin-top:22px}
.share-url input{flex:1;min-width:0;height:48px;border-radius:15px;border:1px solid rgba(101,143,177,.16);
  background:rgba(255,255,255,.6);padding:0 14px;color:#466175;outline:none;
  transition:box-shadow .25s ease,border-color .25s ease}
.share-url input:focus{border-color:rgba(119,185,246,.55);box-shadow:0 0 0 4px rgba(119,185,246,.12)}
.primarybtn,.softbtn{height:48px;border-radius:15px;border:1px solid rgba(255,255,255,.86);padding:0 18px;font-weight:700;cursor:pointer;
  position:relative;overflow:hidden;transition:transform .4s var(--ease-spring),box-shadow .3s ease,filter .3s ease}
.primarybtn{background:linear-gradient(150deg,#27425c,#18293a);color:#fff;border-color:rgba(255,255,255,.18);
  box-shadow:0 12px 28px rgba(30,61,86,.24)}
.primarybtn:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(30,61,86,.3)}
.softbtn{background:rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.softbtn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(63,110,148,.14)}
.primarybtn:active,.softbtn:active{transform:scale(.96)}
.share-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qr-box{width:230px;height:230px;margin:auto;border-radius:30px;padding:18px;background:rgba(255,255,255,.84);
  display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff,0 20px 44px rgba(70,115,150,.16);
  transition:transform .5s var(--ease-spring)}
.qr-box:hover{transform:scale(1.03) rotate(-1deg)}
.qr-box img,.qr-box canvas{max-width:100%;height:auto!important;border-radius:8px}
.qr-fallback{font-size:12px;color:var(--muted);text-align:center;line-height:1.7}

/* ---------- article ---------- */
.article-view{width:min(980px,100%);margin:0 auto}
.article-top{padding:36px 0 28px}
.article-top h1{font-size:clamp(40px,6vw,72px);margin:14px 0;letter-spacing:-.05em}
.article-meta,.article-actions{display:flex;gap:12px;flex-wrap:wrap;color:#82909c;font-size:11px;align-items:center}
.article-actions{margin-top:18px}
.pillbtn{height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.84);
  background:rgba(255,255,255,.58);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;
  position:relative;overflow:hidden;transition:transform .4s var(--ease-spring),box-shadow .3s ease}
.pillbtn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(63,110,148,.14)}
.pillbtn:active{transform:scale(.94)}
.article-cover{border-radius:30px;overflow:hidden;max-height:540px;margin:10px 0 30px;box-shadow:var(--shadow-lift)}
.article-cover img{width:100%;height:100%;object-fit:cover;display:block}
.article-layout{display:grid;grid-template-columns:minmax(0,720px) 200px;gap:42px;justify-content:center}
.article-body{font-size:17px;line-height:1.95;max-width:72ch}
.article-body h2{font-size:30px;margin:48px 0 14px;scroll-margin-top:100px;letter-spacing:-.03em}
.article-body h3{font-size:23px;margin-top:34px;letter-spacing:-.02em}.article-body h4{font-size:18px;font-weight:760;margin:28px 0 10px;letter-spacing:-.01em;scroll-margin-top:100px}
.article-body p{margin:16px 0}
.article-body a{color:#2e6f9f;text-decoration:none;border-bottom:1px solid rgba(46,111,159,.3);transition:border-color .25s ease}
.article-body a:hover{border-color:#2e6f9f}
.article-body img{max-width:100%;height:auto;border-radius:20px;box-shadow:var(--shadow-soft)}
.article-body ul,.article-body ol{padding-left:22px}
.article-body li{margin:8px 0}
.article-body hr{border:0;height:1px;background:linear-gradient(90deg,transparent,rgba(87,126,157,.3),transparent);margin:40px 0}
.article-body table{width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;
  background:rgba(255,255,255,.46);border-radius:16px;overflow:hidden;backdrop-filter:blur(12px)}
.article-body th,.article-body td{padding:11px 14px;text-align:left;border-bottom:1px solid rgba(87,126,157,.12)}
.article-body th{background:rgba(255,255,255,.5);font-weight:700;font-size:13px}
.article-body code{background:rgba(255,255,255,.6);padding:2px 6px;border-radius:7px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.article-body pre{background:rgba(255,255,255,.55);padding:16px;border-radius:16px;overflow:auto;
  border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(12px)}
.article-body blockquote{margin:24px 0;padding:16px 20px;border-left:3px solid #83bdf0;
  background:rgba(255,255,255,.5);border-radius:0 16px 16px 0;backdrop-filter:blur(12px);color:#3f5568}
.toc{position:sticky;top:100px;align-self:start}
.toc-title{font-size:11px;color:#7890a4;margin-bottom:9px}
.toc button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#8290a0;font-size:11px;
  padding:7px 10px;cursor:pointer;border-radius:10px;line-height:1.5;position:relative;
  transition:color .25s ease,background .25s ease,padding-left .3s var(--ease)}
.toc button:hover{background:rgba(255,255,255,.5);color:#4a6a85}
.toc button.active{color:#2f5a7a;font-weight:700;background:rgba(255,255,255,.62);padding-left:16px}
.toc button.active::before{content:"";position:absolute;left:6px;top:50%;width:3px;height:14px;margin-top:-7px;
  border-radius:99px;background:var(--sky)}

.footer{width:min(1160px,calc(100% - 128px));margin:50px auto 0;padding:28px 0 42px;color:#82909c;font-size:11px;
  display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(87,126,157,.14);line-height:1.8}

/* ---------- back to top ---------- */
.totop{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px));
  z-index:90;width:44px;height:44px;border-radius:16px;border:1px solid rgba(255,255,255,.88);cursor:pointer;
  background:linear-gradient(150deg,rgba(255,255,255,.68),rgba(238,249,255,.42));
  backdrop-filter:blur(20px) saturate(165%);-webkit-backdrop-filter:blur(20px) saturate(165%);
  box-shadow:inset 0 1px 0 #fff,0 14px 32px rgba(63,110,148,.16);
  display:grid;place-items:center;color:#5c82a1;font-size:17px;
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
  transition:opacity .35s ease,transform .45s var(--ease-spring)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{transform:translateY(-3px)}
.totop:active{transform:scale(.9)}

/* ---------- search palette ---------- */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(217,236,249,.46);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 24px;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility 0s linear .28s}
.overlay.show{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.searchbox{width:min(760px,100%);max-height:min(78dvh,760px);border-radius:32px;padding:0;overflow:hidden;
  transform:translateY(-14px) scale(.97);filter:blur(6px);
  transition:transform .42s var(--ease-spring),filter .32s ease;
  background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(239,249,255,.56));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 40px 110px rgba(58,101,136,.26)}
.overlay.show .searchbox{transform:none;filter:none}
.search-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.search-title strong{display:block;font-size:13px;letter-spacing:.02em}
.search-title span{display:block;margin-top:3px;font-size:10px;color:#8798a7}
.search-kbd{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#7890a4}
.search-kbd kbd{padding:4px 7px;border:1px solid rgba(91,132,165,.16);border-bottom-color:rgba(91,132,165,.28);
  border-radius:8px;background:rgba(255,255,255,.66);box-shadow:inset 0 1px 0 #fff}
.search-input{margin:0 14px 12px;min-height:58px;border-radius:20px;display:flex;align-items:center;gap:9px;padding:0 8px 0 16px;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.92);
  box-shadow:inset 0 1px 0 #fff,0 8px 26px rgba(75,122,158,.08);transition:box-shadow .24s ease,border-color .24s ease}
.search-input:focus-within{border-color:rgba(119,185,246,.5);
  box-shadow:inset 0 1px 0 #fff,0 0 0 4px rgba(119,185,246,.12),0 14px 34px rgba(75,122,158,.14)}
.search-glyph{width:22px;height:22px;display:grid;place-items:center;color:#7094b1;font-size:21px;line-height:1}
.search-input input{flex:1;height:56px;min-width:0;border:0;background:transparent;padding:0;font-size:17px;outline:none;color:var(--ink)}
.search-input input::placeholder{color:#9aa8b5}
.search-close{flex:none}
.search-meta{display:flex;align-items:center;justify-content:space-between;padding:0 18px 9px;color:#8b9aa7;font-size:10px}
.search-meta b{font-weight:720;color:#6989a3}
.search-results{padding:0 10px 12px;overflow:auto;max-height:calc(min(78dvh,760px) - 164px);overscroll-behavior:contain;scroll-behavior:smooth}
.search-section-label{padding:10px 9px 7px;font-size:10px;color:#8ba1b2;letter-spacing:.09em;font-weight:760}
.search-result{display:grid;grid-template-columns:58px minmax(0,1fr) 24px;gap:12px;align-items:center;padding:10px;
  border-radius:19px;cursor:pointer;transition:background .2s ease,transform .26s var(--ease);
  animation:resultIn .4s var(--ease) both}
@keyframes resultIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.search-result:hover,.search-result.active{background:rgba(255,255,255,.66);transform:translateX(3px)}
.search-result-cover{width:58px;height:58px;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#dceefd,#f8fcff);
  box-shadow:inset 0 0 0 1px rgba(85,129,164,.07)}
.search-result-cover img{width:100%;height:100%;object-fit:cover}
.search-result-cover.noimg{display:grid;place-items:center;color:#79a9cf;font-size:18px;font-weight:800}
.search-result-copy{min-width:0}
.search-result strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.search-result span{display:block;color:#8999a6;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-arrow{color:#7ea3bf;font-size:17px;transition:transform .3s var(--ease)}
.search-result:hover .search-result-arrow{transform:translateX(3px)}
.search-topic-result{grid-template-columns:42px minmax(0,1fr) 24px}
.search-topic-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(195,227,252,.76),rgba(255,255,255,.64));color:#537d9e;font-size:16px}
.search-empty{margin:8px;padding:30px 18px;text-align:center;border:1px dashed rgba(86,125,155,.2);border-radius:20px;
  color:#8293a1;font-size:12px;line-height:1.8}
.search-foot{padding:10px 18px 14px;border-top:1px solid rgba(87,126,157,.1);display:flex;justify-content:space-between;
  gap:12px;font-size:9px;color:#98a5af}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:500;left:50%;bottom:26px;transform:translate(-50%,18px) scale(.96);opacity:0;
  background:rgba(23,36,49,.84);color:#fff;padding:11px 18px;border-radius:999px;font-size:12px;
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 44px rgba(16,36,54,.3);
  transition:opacity .3s ease,transform .45s var(--ease-spring);pointer-events:none;max-width:min(88vw,420px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- splash ---------- */
#welcomeSplash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;
  background:linear-gradient(155deg,#fafcfe,#eef4f9 48%,#e6eef6);
  transition:opacity .6s ease,filter .6s ease,visibility 0s linear .6s}
#welcomeSplash.out{opacity:0;filter:blur(10px);visibility:hidden;pointer-events:none}
.splash-word{text-align:center;font-size:clamp(45px,9vw,100px);font-family:Georgia,"Noto Serif TC",serif;font-weight:500;
  letter-spacing:-.04em;opacity:0;transform:translateY(12px) scale(.94);
  animation:originalIntro .8s var(--ease) forwards;filter:drop-shadow(0 18px 42px rgba(77,139,185,.14))}
.splash-word small{display:block;font:700 10px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.24em;
  margin-top:14px;color:#7f8d9a;opacity:0;animation:originalIntro .7s var(--ease) .25s forwards}
@keyframes originalIntro{to{opacity:1;transform:none}}
.splash-line{position:absolute;bottom:24%;left:50%;width:0;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(119,185,246,.65),transparent);animation:splashLine 1.1s var(--ease) .2s forwards}
@keyframes splashLine{to{width:min(260px,44vw)}}

/* ---------- micro-interactions ---------- */
.jelly{animation:jelly .6s var(--ease)}
@keyframes jelly{0%{transform:scale(1)}35%{transform:scale(.92,1.07)}68%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:5;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
  animation:ripple .65s var(--ease) forwards;mix-blend-mode:screen}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.reveal{opacity:0;transform:translateY(18px) scale(.995);filter:blur(8px);
  transition:opacity .75s var(--ease),transform .75s var(--ease),filter .6s ease}
.reveal.in{opacity:1;transform:none;filter:none}

/* ---------- dark mode ---------- */
body.dark{
  --ink:#edf4fa;--muted:#94a6b5;--bg:#101820;
  --glass-tint-a:rgba(38,55,71,.62);--glass-tint-b:rgba(20,35,48,.4);
  --glass-rim:rgba(160,201,235,.3);--glass-rim-soft:rgba(160,201,235,.07);
  --glass-inner:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.18);
  --shadow-lift:0 30px 80px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.28);
  --shadow-hover:0 44px 104px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.35);
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(66,106,140,.30), transparent 60%),
    linear-gradient(155deg,#0e151c,#16242f 52%,#111d26);
}
body.dark .hero h1{background:linear-gradient(105deg,#eaf3fa 12%,#8ec4ef 44%,#eaf3fa 78%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
body.dark .pager{background:linear-gradient(152deg,rgba(150,196,232,.16),rgba(120,170,210,.04) 46%,rgba(150,196,232,.11));
  box-shadow:0 28px 62px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,255,255,.07)}
body.dark .pager::before{background:conic-gradient(from var(--rim,140deg) at 50% 50%,rgba(186,222,252,.8),rgba(186,222,252,.1) 21%,rgba(186,222,252,.66) 47%,rgba(186,222,252,.07) 71%,rgba(186,222,252,.8))}
body.dark .pager::after{box-shadow:inset 0 0 14px 2px rgba(160,205,245,.12),inset 0 0 0 1px rgba(186,222,252,.1)}
body.dark .pager-thumb{background:linear-gradient(158deg,rgba(150,200,240,.30),rgba(90,140,185,.12) 54%,rgba(150,200,240,.22));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.34),inset 0 -12px 20px -12px rgba(20,50,75,.6),0 12px 26px rgba(0,0,0,.4)}

/* ============================================================
   v14.1 · Mobile Topic Sticky Stack
   Inspired by the supplied reference: cards layer and overlap
   progressively while scrolling, without changing topic data.
   ============================================================ */
@media (max-width: 680px){
  .topic-grid{
    display:block;
    position:relative;
    padding:2px 0 12vh;
  }

  .topic-card{
    --topic-stack-i:0;
    position:-webkit-sticky;
    position:sticky;
    top:calc(84px + env(safe-area-inset-top) + (var(--topic-stack-i) * 58px));
    z-index:calc(30 + var(--topic-stack-i));
    min-height:252px;
    margin:0 0 18px;
    padding:22px 22px 24px;
    transform-origin:50% 0%;
    isolation:isolate;
    background:
      radial-gradient(90% 60% at 18% 0%,rgba(255,255,255,.58),transparent 62%),
      linear-gradient(155deg,rgba(255,255,255,.78),rgba(236,247,255,.64));
    border-color:rgba(255,255,255,.86);
    box-shadow:
      0 18px 46px rgba(63,106,140,.105),
      0 3px 12px rgba(63,106,140,.045),
      inset 0 1px 0 rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(10px) saturate(138%);
    backdrop-filter:blur(10px) saturate(138%);
    transition:
      box-shadow .28s ease,
      border-color .28s ease,
      background .28s ease;
  }

  /* A subtle glass edge makes each overlapped layer readable. */
  .topic-card::after{
    content:"";
    position:absolute;
    left:18px;right:18px;top:0;
    height:1px;
    z-index:4;
    pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);

  }

  .topic-count{

  }

  /* Let the final card release naturally when the section ends. */
  .topic-card:last-child{
    margin-bottom:0;
  }
}

/* ============================================================
   Public v15.5 · publisher + persistent title sheen + repeat reveal
   ============================================================ */

/* Main titles now have a short font/blur load-in, then keep the original
   moving blue/graphite colour sheen indefinitely. */
.hero h1,
.page-hero h1,
.about-hero h1,
.share-title,
.newsletter-card h1,
.article-top h1{
  background:linear-gradient(105deg,#13202c 8%,#366e97 38%,#79bce9 50%,#2f5f86 62%,#13202c 86%);
  background-size:260% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:
    swTitleLoad .88s cubic-bezier(.18,.86,.22,1) both,
    titleSheen 7.2s ease-in-out 1.05s infinite!important;
}
@keyframes swTitleLoad{
  0%{
    opacity:0;
    transform:translate3d(0,16px,0) scale(.985);
    filter:blur(9px);
    letter-spacing:-.075em;

/* ============================================================
   Public v15.6 · navigation smoothness + category motion
   ============================================================ */

/* Same-origin cross-document transitions where supported.
   Browsers without this feature simply ignore the at-rule. */
@view-transition{
  navigation:auto;
}
::view-transition-old(root){
  animation:swRouteOut .18s cubic-bezier(.4,0,1,1) both;
}
::view-transition-new(root){
  animation:swRouteIn .34s cubic-bezier(.18,.82,.22,1) both;
}
@keyframes swRouteOut{
  to{opacity:0;transform:translate3d(0,-5px,0) scale(.998);filter:blur(3px)}
}
@keyframes swRouteIn{
  from{opacity:0;transform:translate3d(0,8px,0);filter:blur(4px)}
}

/* Fallback transition cue for Safari / unsupported cross-document VT. */
body.page-switching #app{
  opacity:.82;
  transform:translate3d(0,-3px,0);
  transition:opacity .12s ease,transform .12s ease;
}
body.page-switching .pager{
  transition:opacity .12s ease,transform .12s ease!important;
}

/* Category chip: compositor-only sweep/pulse. */
.category-chip{
  --cat-h:205;
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
  max-width:100%;
  min-height:23px;
  padding:4px 9px 4px 7px;
  overflow:hidden;
  border-radius:999px;
  border:1px solid hsla(var(--cat-h),58%,62%,.16);
  background:
    linear-gradient(145deg,
      hsla(var(--cat-h),80%,98%,.66),
      hsla(var(--cat-h),70%,90%,.18));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.78),
    0 4px 11px hsla(var(--cat-h),55%,45%,.045);
  color:hsl(var(--cat-h),37%,48%);
  font-size:9px;
  font-weight:780;
  letter-spacing:.07em;
  line-height:1;
  vertical-align:middle;
}
.category-chip::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  flex:0 0 auto;
  background:hsl(var(--cat-h),64%,65%);
  box-shadow:0 0 0 4px hsla(var(--cat-h),64%,65%,.09);
  animation:categoryDot 3.2s ease-in-out infinite;
}
.category-chip::after{
  content:"";
  position:absolute;
  top:-30%;bottom:-30%;
  left:-42%;
  width:34%;
  transform:translate3d(0,0,0) skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
  opacity:0;
}
.article-card:hover .category-chip::after,
.article-card:focus-visible .category-chip::after,
.article-top .category-chip::after{
  opacity:.72;
  animation:categorySweep 1.25s cubic-bezier(.2,.75,.24,1) both;
}
@keyframes categoryDot{
  0%,68%,100%{transform:scale(1);opacity:.72}
  78%{transform:scale(1.28);opacity:1}
  88%{transform:scale(.94);opacity:.86}
}
@keyframes categorySweep{
  from{transform:translate3d(0,0,0) skewX(-18deg)}
  to{transform:translate3d(470%,0,0) skewX(-18deg)}
}

/* Topic cards use an independent rotating classification signal.
   It is small and isolated, so it doesn't repaint the full glass card. */
.topic-signal{
  --cat-h:205;
  position:absolute!important;
  z-index:2!important;
  right:-20px;
  top:-22px;
  width:112px;
  height:112px;
  border-radius:50%;
  pointer-events:none;
  opacity:.52;
  transform:translate3d(0,0,0) rotate(0deg) scale(.96);
  transition:opacity .3s ease,transform .58s cubic-bezier(.18,.86,.22,1);
}
.topic-signal::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 42% 42%,
      hsla(var(--cat-h),85%,76%,.24),
      hsla(var(--cat-h),72%,65%,.06) 46%,
      transparent 68%);
  border:1px solid hsla(var(--cat-h),66%,72%,.13);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.64),
    0 8px 24px hsla(var(--cat-h),58%,45%,.07);
}
.topic-signal::after{
  content:"";
  position:absolute;
  inset:33px;
  border-radius:50%;
  border:1px solid hsla(var(--cat-h),70%,60%,.20);
  border-top-color:hsla(var(--cat-h),78%,58%,.60);
  border-right-color:rgba(255,255,255,.68);
  transform:translate3d(0,0,0);
}
.topic-card:hover .topic-signal,
.topic-card:focus-visible .topic-signal{
  opacity:.9;
  transform:translate3d(-6px,5px,0) rotate(52deg) scale(1.08);
}
.topic-card:hover .topic-signal::after,
.topic-card:focus-visible .topic-signal::after{
  animation:topicOrbit 1.6s linear infinite;
}
@keyframes topicOrbit{
  to{transform:rotate(360deg)}
}
.topic-card .topic-no{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.topic-card .topic-no::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:currentColor;
  opacity:.62;
  transition:transform .35s cubic-bezier(.18,.86,.22,1);
}
.topic-card:hover .topic-no::before,
.topic-card:focus-visible .topic-no::before{
  transform:scale(1.7);
}

/* Topic-detail category badge. */
.topic-detail-badge{
  --cat-h:205;
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:25px;
  padding:6px 10px;
  border-radius:999px;
  color:hsl(var(--cat-h),37%,48%);
  background:hsla(var(--cat-h),72%,93%,.35);
  border:1px solid hsla(var(--cat-h),58%,64%,.13);
  font-size:9px;
  font-weight:800;
  letter-spacing:.11em;
}
.topic-detail-badge i{
  width:6px;height:6px;border-radius:50%;
  background:hsl(var(--cat-h),64%,65%);
  box-shadow:0 0 0 4px hsla(var(--cat-h),64%,65%,.08);
}

/* Keyboard focus remains visually obvious without a heavy global outline. */
.article-card:focus-visible,
.topic-card:focus-visible,
.nav-item:focus-visible,
.backlink:focus-visible,
button:focus-visible,
a:focus-visible{
  outline:2px solid rgba(91,157,207,.42);
  outline-offset:3px;
}

/* Low-power path: preserve the classification look but stop loops. */
@media (hover:none) and (pointer:coarse){
  .category-chip::before{animation:none}
  .category-chip::after{display:none}
  .topic-card:hover .topic-signal::after,
  .topic-card:focus-visible .topic-signal::after{animation:none}
  .topic-signal{opacity:.42}
}
body.lite .category-chip::before,
body.lite .topic-signal::after{animation:none!important}
body.lite .topic-signal{opacity:.35}
body.lite .hero h1,
body.lite .page-hero h1,
body.lite .about-hero h1,
body.lite .share-title,
body.lite .newsletter-card h1,
body.lite .article-top h1{animation:none!important}

/* ============================================================
   Public v17.0 · Synchronized Pager / Page Transition
   ============================================================ */

body{
  --route-opacity:1;
  --route-scale:1;
  --route-chrome-opacity:1;
  --route-veil:0;
}

/* Very light, translucent bridge. The pager sits above this veil. */
body::before{
  content:"";
  position:fixed;
  inset:-5vh -5vw;
  z-index:8890;
  pointer-events:none;
  visibility:hidden;
  opacity:var(--route-veil);
  transform:scale(1.01);
  background:
    radial-gradient(circle at 50% 48%,
      rgba(255,255,255,.54) 0 9%,
      rgba(220,243,255,.32) 25%,
      rgba(172,219,247,.16) 48%,
      rgba(245,251,255,.08) 68%,
      transparent 82%),
    linear-gradient(155deg,
      rgba(252,254,255,.20),
      rgba(225,244,255,.15) 48%,
      rgba(191,224,246,.11));
  transition:
    opacity .12s linear,
    visibility 0s linear .15s;
}
body.page-route-gesture::before,
body.page-route-fx::before{
  visibility:visible;
  transition-delay:0s;
}

/* During a finger/mouse gesture the actual page responds immediately. */
body.page-route-gesture #app,
body.page-route-gesture .footer,
body.page-route-fx #app,
body.page-route-fx .footer{
  opacity:var(--route-opacity);
  transform:translate3d(0,0,0) scale(var(--route-scale));
  transform-origin:50% 48%;
  transition:
    opacity .075s linear,
    transform .115s cubic-bezier(.2,.72,.22,1);
  will-change:opacity,transform;
}

/* Chrome fades but never changes transform, avoiding the old centered-brand jump. */
body.page-route-gesture .brand-top,
body.page-route-gesture .top-actions,
body.page-route-gesture .totop,
body.page-route-fx .brand-top,
body.page-route-fx .top-actions,
body.page-route-fx .totop{
  opacity:var(--route-chrome-opacity)!important;
  transition:opacity .10s linear!important;
}

/* Keep the liquid pager fully readable while the page disappears behind it. */
body.page-route-gesture .pager,
body.page-route-fx .pager{
  z-index:9005!important;
  opacity:1!important;
  filter:none!important;
}

/* Commit phase: quick old-page zoom-in + fade. Values are set by JS. */
body.page-route-fx #app,
body.page-route-fx .footer{
  transition:
    opacity .145s ease-out,
    transform .155s cubic-bezier(.22,.76,.28,1);
}
body.page-route-fx .brand-top,
body.page-route-fx .top-actions,
body.page-route-fx .totop{
  transition:opacity .13s ease-out!important;
}
body.page-route-fx::before{
  transition:opacity .145s ease-out;
}

/* Cross-document destination is held very lightly until data is ready. */
body.page-enter-pending::after,
body.page-enter-fx::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:8885;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 47%,
      rgba(255,255,255,.38),
      rgba(205,236,253,.17) 34%,
      rgba(153,207,239,.07) 58%,
      transparent 78%);
}
body.page-enter-pending::after{opacity:.22}
body.page-enter-pending #app,
body.page-enter-pending .footer{
  opacity:.14;
  transform:translate3d(0,0,0) scale(1.016);
  transform-origin:50% 48%;
}
body.page-enter-pending .brand-top,
body.page-enter-pending .top-actions,
body.page-enter-pending .totop{
  opacity:.34!important;
}

/* New page starts slightly zoomed-in and zooms OUT to its real position. */
body.page-enter-fx::after{
  animation:pageEntryVeil17 .27s ease-out both;
}
body.page-enter-fx #app,
body.page-enter-fx .footer{
  transform-origin:50% 48%;
  animation:pageRouteEnter17 .285s cubic-bezier(.16,.84,.28,1) both!important;
}
body.page-enter-fx .brand-top,
body.page-enter-fx .top-actions,
body.page-enter-fx .totop{
  animation:pageChromeEnter17 .24s ease-out both!important;
}

@keyframes pageRouteEnter17{
  0%{
    opacity:.16;
    transform:translate3d(0,2px,0) scale(1.016);
  }
  58%{
    opacity:.90;
    transform:translate3d(0,0,0) scale(1.003);
  }
  100%{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
}
@keyframes pageChromeEnter17{
  from{opacity:.30}
  to{opacity:1}
}
@keyframes pageEntryVeil17{
  from{opacity:.30}
  to{opacity:0}
}

/* No expensive blur during navigation on iPhone / Safari. */
@media(hover:none) and (pointer:coarse){
  body.page-route-gesture #app,
  body.page-route-fx #app,
  body.page-enter-pending #app,
  body.page-enter-fx #app{
    filter:none!important;
  }
}

/* Respect reduced motion while keeping navigation immediate. */
@media(prefers-reduced-motion:reduce){
  body.page-route-gesture::before,
  body.page-route-fx::before,
  body.page-enter-pending::after,
  body.page-enter-fx::after{
    display:none!important;
  }
  body.page-route-gesture #app,
  body.page-route-gesture .footer,
  body.page-route-fx #app,
  body.page-route-fx .footer,
  body.page-enter-pending #app,
  body.page-enter-pending .footer,
  body.page-enter-fx #app,
  body.page-enter-fx .footer{
    animation:none!important;
    transition:none!important;
    opacity:1!important;
    transform:none!important;
  }
}

/* ============================================================
   Public v17.5 · Glass-first Home
   No waves · no home ripples · more transparent material
   ============================================================ */

/* Home scene is now air / glass, not water. */
body.home-glass-focus{
  --home-glass-a:rgba(255,255,255,.26);
  --home-glass-b:rgba(226,244,255,.075);
  --home-glass-border:rgba(255,255,255,.62);
  --home-glass-shadow:0 24px 74px rgba(70,116,150,.075),
                      inset 0 1px 0 rgba(255,255,255,.84),
                      inset 0 -1px 0 rgba(108,166,203,.06);
}

body.home-glass-focus .home-scroll-scene{
  min-height:calc(100dvh - 92px);
  padding-bottom:86px;
  overflow:clip;
  isolation:isolate;
}

/* Replace the former water bridge with two static refractive light panes. */
body.home-glass-focus .home-scroll-scene::before{
  content:"";
  position:absolute;
  z-index:0;
  right:-7%;
  top:12%;
  width:min(520px,48vw);
  height:min(390px,38vw);
  border-radius:48px;
  transform:rotate(-8deg) skewX(-3deg);
  pointer-events:none;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.24),
      rgba(208,235,252,.075) 46%,
      rgba(255,255,255,.025) 78%);
  border:1px solid rgba(255,255,255,.32);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.58),
    0 40px 100px rgba(80,138,176,.045);
  opacity:.72;
  -webkit-backdrop-filter:blur(4px) saturate(130%);
  backdrop-filter:blur(4px) saturate(130%);
}

body.home-glass-focus .home-scroll-scene::after{
  content:"";
  position:absolute;
  z-index:0;
  left:8%;
  bottom:70px;
  width:min(680px,58vw);
  height:118px;
  border-radius:34px;
  transform:rotate(4deg);
  pointer-events:none;
  background:
    linear-gradient(110deg,
      rgba(255,255,255,.14),
      rgba(176,219,247,.055) 48%,
      rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.46);
  opacity:.54;
}

/* Hero glass becomes visibly more transparent. */
body.home-glass-focus .home-hero-card.glass{
  background:
    radial-gradient(340px 180px at 18% 0%,rgba(255,255,255,.48),transparent 68%),
    linear-gradient(145deg,var(--home-glass-a),var(--home-glass-b))!important;
  border:1px solid var(--home-glass-border)!important;
  box-shadow:var(--home-glass-shadow)!important;
  -webkit-backdrop-filter:blur(18px) saturate(150%) brightness(1.035)!important;
  backdrop-filter:blur(18px) saturate(150%) brightness(1.035)!important;
}

body.home-glass-focus .home-hero-card.glass::before{
  background:
    linear-gradient(150deg,
      rgba(255,255,255,.92) 0%,
      rgba(255,255,255,.24) 31%,
      rgba(255,255,255,.045) 58%,
      rgba(255,255,255,.70) 100%)!important;
}

/* Refraction instead of ocean motion. */
body.home-glass-focus .home-hero-card::after{
  opacity:.42!important;
  background:
    radial-gradient(380px circle at var(--px,50%) var(--py,20%),
      rgba(255,255,255,.58),
      rgba(222,244,255,.11) 44%,
      transparent 66%)!important;
}

/* Latest-article cards also become airier on the home page only. */
body.home-glass-focus .home-next-stage .article-card{
  background:
    radial-gradient(210px 100px at 12% 0%,rgba(255,255,255,.42),transparent 70%),
    linear-gradient(145deg,rgba(255,255,255,.27),rgba(230,246,255,.075))!important;
  border-color:rgba(255,255,255,.56)!important;
  box-shadow:
    0 18px 48px rgba(62,110,145,.065),
    inset 0 1px 0 rgba(255,255,255,.74)!important;
}

body.home-glass-focus .scroll-cue{
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.26);
  -webkit-backdrop-filter:blur(8px) saturate(125%);
  backdrop-filter:blur(8px) saturate(125%);
}
body.home-glass-focus .scroll-cue:hover{
  background:rgba(255,255,255,.19);
}

/* Old water layer is fully retired. */
body.home-glass-focus .home-wave-stage,
body.home-glass-focus .home-wave,
body.home-glass-focus .home-foam{
  display:none!important;
}

/* Keep the next section floating naturally into view. */
body.home-glass-focus .home-next-stage{
  position:relative;
  z-index:2;
}

/* No press-ripple visual on the home page. */
body.home-glass-focus .ripple{
  display:none!important;
}

/* Dark mode keeps the same transparent hierarchy. */
body.dark.home-glass-focus{
  --home-glass-a:rgba(38,55,69,.28);
  --home-glass-b:rgba(17,35,49,.11);
  --home-glass-border:rgba(175,216,244,.20);
  --home-glass-shadow:0 28px 74px rgba(0,0,0,.18),
                      inset 0 1px 0 rgba(255,255,255,.09),
                      inset 0 -1px 0 rgba(0,0,0,.14);
}
body.dark.home-glass-focus .home-next-stage .article-card{
  background:
    radial-gradient(210px 100px at 12% 0%,rgba(255,255,255,.08),transparent 70%),
    linear-gradient(145deg,rgba(28,45,58,.28),rgba(15,31,43,.10))!important;
  border-color:rgba(169,209,236,.12)!important;
}

/* iPhone / touch: maintain transparency without expensive huge blur. */
@media(hover:none) and (pointer:coarse){
  body.home-glass-focus .home-scroll-scene::before,
  body.home-glass-focus .home-scroll-scene::after{
    -webkit-backdrop-filter:none!important;
    backdrop-filter:none!important;
  }
  body.home-glass-focus .home-hero-card.glass{
    background:
      radial-gradient(260px 140px at 15% 0%,rgba(255,255,255,.44),transparent 70%),
      linear-gradient(145deg,rgba(255,255,255,.31),rgba(226,244,255,.09))!important;
    -webkit-backdrop-filter:blur(8px) saturate(128%)!important;
    backdrop-filter:blur(8px) saturate(128%)!important;
  }
  body.home-glass-focus .home-next-stage .article-card{
    background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(232,247,255,.10))!important;
  }
}

@media(max-width:700px){
  body.home-glass-focus .home-scroll-scene{
    padding-bottom:58px;
  }
  body.home-glass-focus .home-scroll-scene::before{
    width:72vw;
    height:46vw;
    right:-28%;
    top:16%;
    border-radius:34px;
    opacity:.44;
  }
  body.home-glass-focus .home-scroll-scene::after{
    width:76vw;
    height:82px;
    left:-16%;
    bottom:48px;
    opacity:.38;
  }
}

@media(prefers-reduced-motion:reduce){
  body.home-glass-focus .home-scroll-scene::before,
  body.home-glass-focus .home-scroll-scene::after{
    transform:none!important;
  }
}


/* ============================================================

   ============================================================ */

  --muted:#b8c8d4!important;
}

  .topic-no,

  .topic-count,

  .search-meta,

  .newsletter-consent,
  .newsletter-status,
  .newsletter-note,
  .about-manifesto p,
  .about-team-head p,
  .about-team-head > span,

/* Mobile centering:
   older rules left #app at 28px while right remained 14px, which shifts
   the whole public canvas off visual center on phones. */
@media(max-width:700px){
  :root{
    --sw-mobile-gutter:16px;
  }

  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  #app{
    width:100%!important;
    max-width:100%!important;
    margin-left:auto!important;
    margin-right:auto!important;
    padding-left:max(var(--sw-mobile-gutter),env(safe-area-inset-left))!important;
    padding-right:max(var(--sw-mobile-gutter),env(safe-area-inset-right))!important;
  }

  .shell,
  .home-scroll-scene,
  .hero,
  .page-hero,
  .section,
  .article-view,
  .share-wrap,
  .newsletter-wrap,
  .about-wrap,
  .home-next-stage{
    width:100%!important;
    max-width:100%!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }

  .article-grid,
  .topic-grid,
  .share-card,
  .newsletter-card,
  .people-grid{
    margin-left:auto!important;
    margin-right:auto!important;
  }

  .footer{
    width:calc(100% - (var(--sw-mobile-gutter) * 2))!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }

  /* Header and bottom pager stay mathematically centered to viewport. */
  .brand-top{
    left:50%!important;
    right:auto!important;
    transform:translate3d(-50%,0,0)!important;
  }
  .brand-top:hover{
    transform:translate3d(-50%,-1px,0)!important;
  }
  .pager{
    left:50%!important;
    right:auto!important;
    transform:translateX(-50%)!important;
  }

  /* Prevent a wide child from making the content appear offset. */
  .hero > *,
  .section > *,
  .article-view > *,
  .page-hero > *{
    min-width:0;
    max-width:100%;
  }

  .share-card,
  .newsletter-card{
    width:100%!important;
  }
}

/* Slightly larger visual gutter on very narrow iPhones without asymmetry. */
@media(max-width:390px){
  :root{
    --sw-mobile-gutter:14px;
  }
}


/* ============================================================
   Public v18.2 · Stability + Performance
   ============================================================ */

/* Dark mode highlight readability: v17.8 was too aggressive for inline
   highlighted spans. Marks get an intentional high-contrast palette. */
body.dark .article-body mark{
  color:#17212d!important;
  background:
    linear-gradient(transparent 36%,rgba(255,225,101,.92) 36% 91%,transparent 91%)!important;
}
body.dark .article-body span[style*="background-color"],
body.dark .article-body span[style*="background:"]{
  color:inherit!important;
}

/* Hidden tabs should not keep animating the four ambient lights. */
body.sw-page-hidden .orb{
  animation-play-state:paused!important;
}

/* Keep the visual identity but reduce iOS compositing cost. */
@media(max-width:700px), (pointer:coarse){
  body{
    background-attachment:scroll!important;
  }
  .ambient{
    filter:blur(52px) saturate(126%)!important;
    opacity:.78!important;
  }
  .orb.d{
    opacity:.36!important;
  }
  .grain{
    opacity:.13!important;
  }
  .glass,
  .lightcard{
    backdrop-filter:blur(15px) saturate(145%)!important;
    -webkit-backdrop-filter:blur(15px) saturate(145%)!important;
  }
  button,
  a,
  input,
  label{
    touch-action:manipulation;
  }
}

/* Automatic low-fx for save-data / low-memory devices. */
html.sw-lowfx .ambient{
  filter:blur(38px) saturate(118%)!important;
  opacity:.70!important;
}
html.sw-lowfx .orb.c,
html.sw-lowfx .orb.d{
  animation:none!important;
}
html.sw-lowfx .cursor-glow{
  display:none!important;
}

/* Last-resort center guard: no public page can exceed the mobile viewport. */
@media(max-width:700px){
  #app,
  #app > *,
  .shell,
  .section,
  .article-view,
  .page-hero{
    min-width:0!important;
  }
  img,
  video,
  iframe{
    max-width:100%;
  }
}

/* Reduced-motion means readable immediately, not "animation but slower". */
@media(prefers-reduced-motion:reduce){
  .orb{animation:none!important}
  [class*="reveal"]{
    opacity:1!important;
    transform:none!important;
    translate:0!important;
    filter:none!important;
  }
}


/* ============================================================
   Public v18.2 · Overall Performance / UX / Accessibility
   ============================================================ */
html,body{
  overscroll-behavior-x:none;
}
h1,h2,h3{
  text-wrap:balance;
  overflow-wrap:anywhere;
}
p,li,figcaption{
  overflow-wrap:break-word;
}
body.sw-page-hidden .orb,
body.visual-paused .orb{
  animation-play-state:paused!important;
}

/* Better touch ergonomics without changing desktop density. */
@media (max-width:700px), (pointer:coarse){
  button,
  .pillbtn,
  .softbtn,
  .cta,
  .pager button,
  .top-actions button{
    min-height:44px;
    touch-action:manipulation;
  }
  input,select,textarea{
    font-size:16px!important;
  }
  .article-body{
    overflow-wrap:anywhere;
  }
}

/* Explicit high-contrast fallback. */
@media (prefers-contrast:more){
  body{--muted:#516779}
  body.dark{--muted:#d0dde6!important}
  .glass,.lightcard{
    border-color:rgba(97,133,162,.34)!important;
  }
}

/* Printing articles should be clean, white and ink-friendly. */
@media print{
  body{background:#fff!important;color:#111!important}
  .ambient,.grain,.cursor-glow,.brand-top,.top-actions,.pager,
  .reading-progress,.to-top,.article-actions,.toc,.footer,
  #welcomeSplash,#idleSubscribePrompt{display:none!important}
  #app,.article-view,.article-layout,.article-body{
    display:block!important;width:auto!important;max-width:none!important;
    margin:0!important;padding:0!important;box-shadow:none!important;
  }
  .article-body{color:#111!important}
  .article-body a{color:#111!important;text-decoration:underline!important}
}

:root{

  --sw-pink-2:#faedf1;

  --sw-green-2:#eef8f3;

/* ------------------------------------------------------------
   Liquid slider micro-interaction
   Instagram / Threads inspired: the lens gently grows while moving,
   then springs back without disturbing its translation.
   Individual CSS `scale` is independent from JS `transform`.
   ------------------------------------------------------------ */
.pager-thumb{
  scale:1;
  will-change:transform,scale!important;
  transition:
    scale .38s var(--apple-spring),
    box-shadow .28s ease!important;
}
body.pager-dragging .pager-thumb{
  scale:1.068;
  transition:
    scale .145s cubic-bezier(.2,.9,.3,1),
    box-shadow .18s ease!important;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.98),
    inset 0 -10px 22px -14px rgba(111,164,210,.36),
    0 15px 30px rgba(67,112,150,.18),
    0 1px 4px rgba(67,112,150,.11)!important;
}
body.pager-programmatic .pager-thumb,
.pager.nav-traveling .pager-thumb{
  scale:1.045;
  transition:
    scale .18s cubic-bezier(.2,.9,.3,1),
    box-shadow .22s ease!important;
}
.pager-thumb{
  background:
    radial-gradient(120% 100% at 26% 0%,rgba(255,255,255,.98),rgba(255,255,255,.34) 44%,transparent 72%),
    linear-gradient(155deg,rgba(249,252,255,.86),rgba(225,239,253,.42))!important;
}
.pager::before{
  background:
    conic-gradient(
      from var(--rim,140deg) at 50% 50%,
      rgba(255,255,255,.98),
      rgba(208,231,252,.44) 22%,

<script>
(()=>{
'use strict';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$('#app');
const raf=cb=>requestAnimationFrame(cb);
const reduceMotion=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const lite=()=>document.body.classList.contains('lite');


function signwellPublicBackendBase(){
  const a=window.SIGNWELL_ANALYTICS||{};
  const n=window.SIGNWELL_NEWSLETTER||{};
  return String(n.endpoint||a.endpoint||'').replace(/\/+$/,'');
}
function signwellPublicBackendEnabled(){
  const a=window.SIGNWELL_ANALYTICS||{};
  const n=window.SIGNWELL_NEWSLETTER||{};
  const enabled=a.enabled===true||n.enabled===true;
  return enabled&&/^https:\/\//i.test(signwellPublicBackendBase());
}
function signwellPublicGasBridge(action,payload={},timeoutMs=22000){
  return new Promise((resolve,reject)=>{
    if(!signwellPublicBackendEnabled())return reject(new Error('SIGN WELL Backend 尚未啟用'));

    const endpoint=signwellPublicBackendBase();
    const requestId='swp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    const frameName='swpframe_'+requestId;
    const iframe=document.createElement('iframe');
    iframe.name=frameName;
    iframe.title='SIGN WELL Backend';
    iframe.tabIndex=-1;
    iframe.setAttribute('aria-hidden','true');
    Object.assign(iframe.style,{
      position:'fixed',width:'1px',height:'1px',opacity:'0',
      pointerEvents:'none',left:'-9999px',top:'-9999px'
    });

    const form=document.createElement('form');
    form.method='POST';
    form.action=endpoint;
    form.target=frameName;
    form.style.display='none';

    const add=(name,value)=>{
      const input=document.createElement('input');
      input.type='hidden';
      input.name=name;
      input.value=String(value??'');
      form.appendChild(input);
    };
    add('transport','iframe');
    add('requestId',requestId);
    add('returnOrigin',location.origin);
    add('action',action);
    add('payload',JSON.stringify(payload||{}));

    let timer=null;
    const cleanup=()=>{
      clearTimeout(timer);
      window.removeEventListener('message',onMessage);
      form.remove();
      setTimeout(()=>iframe.remove(),50);
    };
    const onMessage=e=>{
      const d=e.data;
      if(!d||d.source!=='SIGNWELL_GAS'||d.requestId!==requestId)return;
      cleanup();
      d.ok?resolve(d.data||{}):reject(new Error(d.error||'SIGN WELL Backend error'));
    };

    window.addEventListener('message',onMessage);
    timer=setTimeout(()=>{
      cleanup();
      reject(new Error('SIGN WELL Backend 連線逾時'));
    },timeoutMs);

    document.body.appendChild(iframe);
    document.body.appendChild(form);
    form.submit();
  });
}

const ANALYTICS_KEY='signwell-analytics-v1';
const ANALYTICS_CHANNEL='signwell-analytics';

const ANALYTICS_CFG=()=>window.SIGNWELL_ANALYTICS||{};
function analyticsEndpoint(){
  return signwellPublicBackendBase();
}
function remoteAnalyticsEnabled(){
  const a=ANALYTICS_CFG(),n=window.SIGNWELL_NEWSLETTER||{};
  const enabled=a.enabled===true||n.enabled===true;
  return enabled&&/^https:\/\//i.test(signwellPublicBackendBase());
}
function sendRemoteView(kind,key,eventId){
  if(!remoteAnalyticsEnabled())return;
  signwellPublicGasBridge('analytics.track',{
    kind:String(kind||''),
    key:String(key||''),
    eventId:String(eventId||''),
    path:location.pathname+location.hash,
    referrer:document.referrer?String(document.referrer).slice(0,240):''
  },16000).catch(()=>{});
}

function analyticsToday(){
  try{
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const m=Object.fromEntries(parts.map(x=>[x.type,x.value]));
    return `${m.year}-${m.month}-${m.day}`;
  }catch(_){return new Date().toISOString().slice(0,10)}
}
function readPublicAnalytics(){
  try{
    const a=JSON.parse(localStorage.getItem(ANALYTICS_KEY)||'{}');
    return {
      version:1,
      total:Number(a.total||0),
      daily:a.daily&&typeof a.daily==='object'?a.daily:{},
      articles:a.articles&&typeof a.articles==='object'?a.articles:{}
    };
  }catch(_){return{version:1,total:0,daily:{},articles:{}}}
}
function writePublicAnalytics(a){
  try{
    localStorage.setItem(ANALYTICS_KEY,JSON.stringify(a));
    try{const bc=new BroadcastChannel(ANALYTICS_CHANNEL);bc.postMessage({type:'view'});bc.close()}catch(_){}
  }catch(_){}
}
function trackPublicView(kind,key){
  const clean=String(key||'').trim();
  if(!clean)return;

  const eventId=makeAnalyticsEventId(kind,clean);
  sendRemoteView(kind,clean,eventId);

  /* local fallback mirrors the actual route transition count.
     It is no longer the canonical CMS number once Google Sheet Analytics is enabled. */
  const a=readPublicAnalytics(),day=analyticsToday();
  a.total+=1;
  a.daily[day]=Number(a.daily[day]||0)+1;

  if(kind==='article'){
    const item=a.articles[clean]&&typeof a.articles[clean]==='object'
      ?a.articles[clean]
      :{total:0,daily:{}};

    item.total=Number(item.total||0)+1;
    item.daily=item.daily&&typeof item.daily==='object'?item.daily:{};
    item.daily[day]=Number(item.daily[day]||0)+1;
    item.lastAt=new Date().toISOString();
    a.articles[clean]=item;
  }

  writePublicAnalytics(a);
}

let lastTrackedViewSignature='';

function makeAnalyticsEventId(kind,key){
  try{
    return 'pv_'+crypto.randomUUID();
  }catch(_){
    return 'pv_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)+'_'+String(kind)+'_'+String(key).slice(0,36);
  }
}

function trackRouteView(r){
  let kind='',key='';
  if(r.page==='article'&&ready){kind='article';key=r.slug}
  else if(r.page==='topicDetail'&&ready){kind='page';key='topic:'+r.slug}
  else if(['home','topics','about','share','newsletter'].includes(r.page)){kind='page';key=r.page}
  if(!kind||!key)return;

  const sig=kind+':'+key;
  if(sig===lastTrackedViewSignature)return;
  lastTrackedViewSignature=sig;
  trackPublicView(kind,key);
}

function validBundle(v){
  return v&&typeof v==='object'
    &&Array.isArray(v.topics)

function bundleRevision(v){
  const n=Number(v?.revision||0);

function normalizeTopics(list){
  return (Array.isArray(list)?list:[])
    .filter(x=>x&&x.active!==false)
    .map((x,i)=>({
      id:String(x.id||('topic-'+i)),
      name:String(x.name||'未命名主題'),
      slug:String(x.slug||slugify(x.name||('topic-'+i))),
      description:String(x.description||''),
      order:Number.isFinite(Number(x.order))?Number(x.order):i,
      active:x.active!==false
    }))
    .sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name),'zh-Hant'));

function applyPublicBundle(bundle,{paintNow=true}={}){
  if(!validBundle(bundle))return false;
  const rev=bundleRevision(bundle);
  publicBundleRevision=Math.max(publicBundleRevision,rev);
  siteText={...DEFAULT_SITE_TEXT,...bundle.siteText};
  topics=normalizeTopics(bundle.topics);
  people=normalizePeople(bundle.people);
  writeSessionJSON(SW_BUNDLE_CACHE,bundle);
  writeSessionJSON(SW_TOPICS_CACHE,topics);
  applyChrome();
  if(ready&&paintNow){
    paint().then(()=>initReveal()).catch(()=>{});
  }
  return true;
}
function readCachedPublicBundle(){
  const b=readSessionJSON(SW_BUNDLE_CACHE);
  if(validBundle(b)){applyPublicBundle(b,{paintNow:false});return true}

}
async function fetchBundleCandidate(url){
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'sw='+Date.now(),{
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    if(!r.ok)throw 0;
    const v=await r.json();
    return validBundle(v)?v:null;
  }catch(_){return null}
}
async function fetchPublicBundleFresh(){
  /* Read both GitHub Pages and raw main. Raw main lets CMS changes appear
     before Pages deployment catches up. We choose the newest revision. */
  const [pageRes,rawRes]=await Promise.allSettled([
    fetchBundleCandidate(PUBLIC_BUNDLE_PATH),
    fetchBundleCandidate(PUBLIC_RAW_BUNDLE)
  ]);
  const candidates=[
    pageRes.status==='fulfilled'?pageRes.value:null,
    rawRes.status==='fulfilled'?rawRes.value:null
  ].filter(validBundle);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>bundleRevision(b)-bundleRevision(a));
  return candidates[0];
}
async function loadPublicBundle(){

  const fresh=await fetchPublicBundleFresh();

async function fetchArticlesFresh(){

}

async function loadArticles(){

async function fetchTopicsFresh(){
  try{
    /* Unique query + no-store prevents Safari/GitHub Pages from serving the previous topic file. */
    const r=await fetch('topics/index.json?sw='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const a=await r.json();
    if(!Array.isArray(a))throw 0;
    return {ok:true,data:a.filter(x=>x&&x.active!==false)};
  }catch(_){
    return {ok:false,data:[]};
  }
}

function topicFallbackFromArticles(){
  const seen=new Set();
  return articles.map(a=>a.category).filter(Boolean).filter(n=>!seen.has(n)&&seen.add(n))

}

async function loadTopics(){
  const cached=readSessionJSON(SW_TOPICS_CACHE);
  if(Array.isArray(cached)){
    /* Empty [] is valid: CMS is allowed to publish zero visible topics. */
    topics=cached.filter(x=>x&&x.active!==false);
    sortTopics();
    return;
  }
  const fresh=await fetchTopicsFresh();
  topics=fresh.ok?fresh.data:topicFallbackFromArticles();
  sortTopics();
  if(fresh.ok)writeSessionJSON(SW_TOPICS_CACHE,topics);
}

/* Stale-while-revalidate that actually updates the current screen.
   v13.2 refreshed only the cache in the background, so the visible topic page
   could stay stale until another navigation. */
async function revalidatePublicData(force=false){
  const now=Date.now();
  if(!force && now-swLastRefresh<2500)return false;
  swLastRefresh=now;

  const beforeArticles=stableJSON(articles);
  const beforeTopics=stableJSON(topics);
  const beforeSite=stableJSON(siteText);
  const beforePeople=stableJSON(people);

  const [af,bundle]=await Promise.all([
    fetchArticlesFresh(),
    fetchPublicBundleFresh()
  ]);

  let changed=false;

  if(af.ok){
    const nextA=af.data.filter(x=>x&&x.status==='Published');
    nextA.sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')));
    if(stableJSON(nextA)!==beforeArticles){
      articles=nextA;
      articleCache.clear();
      changed=true;
    }
    writeSessionJSON(SW_ARTICLES_CACHE,nextA);
  }

  if(bundle){
    const nextTopics=normalizeTopics(bundle.topics);
    const nextSite={...DEFAULT_SITE_TEXT,...bundle.siteText};
    const nextPeople=normalizePeople(bundle.people);
    if(stableJSON(nextTopics)!==beforeTopics||stableJSON(nextSite)!==beforeSite||stableJSON(nextPeople)!==beforePeople)changed=true;
    applyPublicBundle(bundle,{paintNow:false});
  }else{
    /* Compatibility fallback for old repositories before public-data.json exists. */
    const tf=await fetchTopicsFresh();
    if(tf.ok){
      const nextT=normalizeTopics(tf.data);
      if(stableJSON(nextT)!==beforeTopics){
        topics=nextT;
        changed=true;
      }
      writeSessionJSON(SW_TOPICS_CACHE,nextT);
    }
  }

  if(changed&&ready){
    applyChrome();
    await paint();
    initReveal();
  }
  return changed;
}
function schedulePublicRevalidate(delay=180){
  setTimeout(()=>revalidatePublicData(true).catch(()=>{}),delay);
}
async function getFullArticle(slug){
  if(articleCache.has(slug))return articleCache.get(slug);
  const meta=articles.find(a=>a.slug===slug);
  if(!meta)return null;
  if(meta.content){articleCache.set(slug,meta);return meta}
  try{
    const file=meta.file||`articles/${encodeURIComponent(slug)}.json`;
    const r=await fetch(file+'?v='+encodeURIComponent(meta.revision||''),{cache:'default'});
    if(!r.ok)throw 0;
    const full={...meta,...await r.json()};
    articleCache.set(slug,full);
    return full;
  }catch(_){return meta}
}

function sanitizeHTML(html=''){
  const d=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,form,input,button,meta,link').forEach(n=>n.remove());
  d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{
    if(a.name.toLowerCase().startsWith('on')||((a.name==='src'||a.name==='href')&&/^javascript:/i.test(a.value)))el.removeAttribute(a.name);
  }));
  d.body.querySelectorAll('img').forEach(im=>{im.loading='lazy';im.decoding='async'});
  const used=new Set();let i=0;
  d.body.querySelectorAll('h2,h3,h4').forEach(h=>{
    if(h.id){used.add(h.id);return}
    const base='section-'+(slugify(h.textContent||'')||String(++i));
    let id=base,n=2;while(used.has(id))id=base+'-'+(n++);used.add(id);h.id=id;
  });
  return d.body.firstElementChild?.innerHTML||'';
}
function renderContent(a){return sanitizeHTML(a?.content||'')}
function excerpt(a){
  if(a.excerpt)return a.excerpt;
  const d=document.createElement('div');d.innerHTML=a.content?renderContent(a):'';
  return(d.textContent||a.searchText||'').replace(/\s+/g,' ').trim().slice(0,150);
}
function readingTime(a){return Number(a.readingTime)||Math.max(1,Math.round((a.searchText||excerpt(a)).replace(/\s/g,'').length/450))}
function topicCount(tp){return articles.filter(a=>a.category===tp.name||slugify(a.category||'')===tp.slug).length}
