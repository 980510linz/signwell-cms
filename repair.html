<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>SIGN WELL CMS · Repair</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:linear-gradient(145deg,#eef8ff,#fff 48%,#effbf7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;color:#112535}.card{width:min(520px,calc(100% - 40px));box-sizing:border-box;padding:32px;border-radius:28px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.96);box-shadow:0 28px 80px rgba(44,74,96,.14);text-align:center}h1{margin:0 0 8px;font-size:30px}p{margin:0;color:#647786;line-height:1.75;font-size:14px}.status{margin-top:20px;padding:12px 14px;border-radius:14px;background:#f4f8fa;font-weight:700}button{width:100%;margin-top:16px;min-height:48px;border:0;border-radius:15px;background:#10293a;color:white;font-weight:800;font-size:15px}</style></head><body><div class="card"><h1>SIGN WELL CMS Repair</h1><p>正在清除舊 Service Worker、CMS Cache 與過期 Backend 設定。完成後會自動重新開啟乾淨的 CMS。</p><div class="status" id="status">正在修復…</div><button id="retry" hidden>重新嘗試</button></div><script>(()=>{const ENDPOINT="https://script.google.com/macros/s/AKfycbzmZXZSepxCD1jbfpjMxsnvn0nRl-xEpeXdJoTO-TZL6Z5Zk7T-OsVGpTkIxWaCh-Y/exec";const status=document.getElementById('status'),retry=document.getElementById('retry');const wait=ms=>new Promise(r=>setTimeout(r,ms));async function repair(){retry.hidden=true;status.textContent='正在清除 Service Worker…';try{try{localStorage.removeItem('signwell-backend-endpoint-explicit');localStorage.setItem('signwell-backend-endpoint',ENDPOINT);sessionStorage.clear()}catch(_){}if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>{try{return new URL(r.scope).pathname.startsWith(new URL('./',location.href).pathname)}catch(_){return false}}).map(r=>r.unregister()))}status.textContent='正在清除 CMS 快取…';if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('signwell-cms-')||k.includes('signwell')).map(k=>caches.delete(k)))}await wait(180);status.textContent='修復完成，正在重新載入 CMS…';const u=new URL('./',location.href);u.searchParams.set('repaired','1');u.searchParams.set('t',Date.now().toString());location.replace(u.toString())}catch(err){status.textContent='修復未完成：'+String(err&&err.message||err||'未知錯誤');retry.hidden=false}}retry.addEventListener('click',repair);repair()})();</script></body></html>
