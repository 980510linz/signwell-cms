:root{--tenho:#86caff;--tenho-deep:#58a9ed;--tenho-pale:rgba(134,202,255,.20);--spring:cubic-bezier(.18,1.35,.36,1);--glass-depth:0 30px 80px rgba(55,93,126,.13),0 9px 26px rgba(55,93,126,.065),inset 0 1px 0 rgba(255,255,255,.97)}
html{scrollbar-color:rgba(86,169,237,.72) rgba(232,242,250,.50);scrollbar-width:thin}
body::before{content:"";position:fixed;inset:-14%;z-index:0;pointer-events:none;background:radial-gradient(circle at 14% 12%,rgba(134,202,255,.20),transparent 26%),radial-gradient(circle at 84% 30%,rgba(210,239,255,.25),transparent 25%),radial-gradient(circle at 54% 88%,rgba(134,202,255,.11),transparent 27%);filter:blur(18px);animation:cmsSky 15s ease-in-out infinite alternate}
@keyframes cmsSky{to{transform:translate3d(1%,.8%,0) scale(1.04)}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:rgba(235,244,250,.44)}::-webkit-scrollbar-thumb{border:3px solid transparent;background:linear-gradient(180deg,#b8e5ff,#62b3ef);background-clip:padding-box;border-radius:999px}
.glass,.lock-card,.panel,.editor-main,.editor-side,.stat,.modal-card,.preview-shell{box-shadow:var(--glass-depth)}
.lock-card,.stat,.panel{--rx:0deg;--ry:0deg;--lift:0px;--px:50%;--py:25%;transform:perspective(1200px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transform-style:preserve-3d;will-change:transform;transition:transform .45s var(--spring),box-shadow .35s ease,border-color .28s ease}
.lock-card::before,.stat::before,.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(280px circle at var(--px) var(--py),rgba(255,255,255,.52),rgba(134,202,255,.09) 42%,transparent 68%);mix-blend-mode:screen;opacity:.65}
.stat{position:relative;overflow:hidden}.stat:hover,.panel:hover{--lift:-3px;border-color:rgba(255,255,255,.96)}
.sidebar{position:relative;overflow:hidden}.sidebar::after{content:"";position:absolute;top:-70%;left:-55%;width:34%;height:240%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.58),transparent);transform:rotate(16deg);filter:blur(4px);animation:cmsSheen 9.2s var(--ease) infinite;pointer-events:none}@keyframes cmsSheen{0%,65%{translate:-120% 0;opacity:0}72%{opacity:.85}100%{translate:650% 0;opacity:0}}
.mark{box-shadow:inset 0 1px 0 #fff,0 9px 24px rgba(88,169,237,.16)}
.top-action,.smallbtn,.toolbar button,.nav button,.row-actions button,.lock button{transition:transform .25s var(--spring),box-shadow .23s ease,background .23s ease,color .23s ease}
.top-action:hover,.smallbtn:hover,.toolbar button:hover,.nav button:hover{transform:translateY(-2px)}
.top-action.primary{background:linear-gradient(180deg,#31485d,#22313f);box-shadow:0 12px 28px rgba(42,72,96,.18),inset 0 1px 0 rgba(255,255,255,.14)}
.top-action.online{background:linear-gradient(180deg,#80c8fb,#58a9ed);color:#fff;border-color:rgba(255,255,255,.50);box-shadow:0 12px 28px rgba(88,169,237,.26),inset 0 1px 0 rgba(255,255,255,.38)}
.jelly{animation:jellyPress .56s var(--spring)!important}@keyframes jellyPress{0%{scale:1}28%{scale:.92 1.07}56%{scale:1.045 .965}78%{scale:.988 1.012}100%{scale:1}}
.publish-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:12px;margin-top:12px}.publish-card{position:relative;padding:22px;border:1px solid rgba(255,255,255,.84);border-radius:24px;background:rgba(255,255,255,.36);box-shadow:var(--glass-depth);overflow:hidden}.publish-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 0%,rgba(134,202,255,.16),transparent 36%)}.publish-card>*{position:relative;z-index:1}.publish-card h3{margin:0 0 8px;font:500 24px/1.1 Georgia,"Noto Serif TC",serif}.publish-card p{margin:0;color:#74818d;font-size:11px;line-height:1.8}.publish-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.publish-form .full{grid-column:1/-1}.publish-form label{display:grid;gap:6px;color:#7f8d99;font-size:9.5px;font-weight:700;letter-spacing:.06em}.publish-form input{height:42px;border:1px solid rgba(86,106,124,.13);border-radius:13px;background:rgba(255,255,255,.58);padding:0 12px;color:var(--ink);outline:0}.publish-form input:focus{border-color:rgba(88,169,237,.46);box-shadow:0 0 0 4px rgba(88,169,237,.08)}.publish-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.publish-status{margin-top:12px;min-height:20px;color:#6d7d8a;font-size:10.5px;line-height:1.6}.security-note{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(134,202,255,.09);border:1px solid rgba(88,169,237,.12);color:#617383;font-size:10px;line-height:1.65}.file-map{display:grid;gap:8px;margin-top:15px}.file-map div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.43);border:1px solid rgba(255,255,255,.72);font-size:10.5px}.file-map code{font-size:10px;color:#4f6f87}.file-ok{color:#558477;font-weight:750}

function compressImage(file,maxSide=1600,quality=.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);let out;try{out=c.toDataURL('image/webp',quality);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',quality)}catch(_){out=c.toDataURL('image/jpeg',quality)}resolve(out)};img.src=reader.result};reader.readAsDataURL(file)})}

/* ===== SIGN WELL Storage Architecture v10 =====
   - Drafts/state: IndexedDB
   - Images: GitHub assets/uploads/YYYY/MM
   - Public list: articles/index.json
   - Full article: articles/<slug>.json
   - Legacy articles.js: compatibility fallback only
   ========================================================= */
const V10_INDEX_PATH='articles/index.json',V11_TOPICS_PATH='topics/index.json',PUBLIC_BUNDLE_PATH='public-data.json';

async function checkPublicFrontFiles(token){
  const missing=[],present=[];
  for(const path of PUBLIC_FRONT_FILES){
    try{
      await githubRequest(githubContentURL(path)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch),token);
      present.push(path);
    }catch(e){
      if(/Not Found|404/i.test(e.message))missing.push(path);
      else throw e;
    }
  }
  return {missing,present};
}
function v10Hash(s=''){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function v10Plain(html=''){const d=document.createElement('div');d.innerHTML=html;return (d.textContent||'').replace(/\s+/g,' ').trim()}
function v10ReadingTime(a){return Math.max(1,Math.round(v10Plain(a.content||'').replace(/\s+/g,'').length/450))}
function v10Revision(a){return v10Hash(JSON.stringify([a.title,a.slug,a.category,a.type,a.excerpt,a.tags,a.cover,a.content,a.publishedAt,a.featured,a.status]))}
function v10SafeSlug(a){return slugify(a.slug||a.title||a.id||('article-'+Date.now()))}

function dataUrlParts(url=''){const m=String(url).match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=\s]+)$/);return m?{mime:m[1].toLowerCase(),base64:m[2].replace(/\s/g,'')}:null}
function extForMime(m=''){if(m.includes('webp'))return'webp';if(m.includes('png'))return'png';if(m.includes('gif'))return'gif';return'jpg'}
async function v10CreateBlob(base64,token){return githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/blobs`,token,{method:'POST',body:JSON.stringify({content:base64,encoding:'base64'})})}
async function v10ImageTreeEntry(dataUrl,slug,kind,token,cache){if(cache.has(dataUrl))return cache.get(dataUrl);const p=dataUrlParts(dataUrl);if(!p)return null;const now=new Date(),ym=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}`,name=`${slug}-${kind}-${v10Hash(dataUrl)}.${extForMime(p.mime)}`,path=`assets/uploads/${ym}/${name}`,blob=await v10CreateBlob(p.base64,token),entry={path,mode:'100644',type:'blob',sha:blob.sha},out={entry,url:path};cache.set(dataUrl,out);return out}
async function v10PrepareArticle(article,token,imageEntries,imageCache){const a=clone(article),slug=v10SafeSlug(a);a.slug=slug;if(dataUrlParts(a.cover||'')){const up=await v10ImageTreeEntry(a.cover,slug,'cover',token,imageCache);if(up){imageEntries.push(up.entry);a.cover=up.url}}if(a.contentFormat==='html'&&a.content){const doc=new DOMParser().parseFromString(`<div id="v10root">${a.content}</div>`,'text/html'),root=doc.getElementById('v10root'),imgs=[...root.querySelectorAll('img[src^="data:image/"]')];for(let i=0;i<imgs.length;i++){const src=imgs[i].getAttribute('src')||'',up=await v10ImageTreeEntry(src,slug,'img'+(i+1),token,imageCache);if(up){imageEntries.push(up.entry);imgs[i].setAttribute('src',up.url)}}a.content=root.innerHTML}a.updatedAt=a.updatedAt||new Date().toISOString().slice(0,10);return a}
async function v10BranchBase(token){const ref=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/ref/heads/${encodeURIComponent(PUBLIC_GITHUB.branch)}`,token),commit=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/commits/${ref.object.sha}`,token);return {head:ref.object.sha,tree:commit.tree.sha}}
async function v10BatchCommit(entries,token,message){const base=await v10BranchBase(token),dedup=new Map();entries.forEach(e=>dedup.set(e.path,e));const tree=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/trees`,token,{method:'POST',body:JSON.stringify({base_tree:base.tree,tree:[...dedup.values()]})}),commit=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/commits`,token,{method:'POST',body:JSON.stringify({message,tree:tree.sha,parents:[base.head]})});await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/refs/heads/${encodeURIComponent(PUBLIC_GITHUB.branch)}`,token,{method:'PATCH',body:JSON.stringify({sha:commit.sha,force:false})});return commit.sha}
async function v11FetchTopicsRaw(){const url=`https://raw.githubusercontent.com/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/${encodeURIComponent(PUBLIC_GITHUB.branch)}/${V11_TOPICS_PATH}?v=${Date.now()}`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('topics not found');const a=await r.json();if(!Array.isArray(a))throw new Error('topics invalid');return a}
function v11TopicPayload(){return (data.topics||[]).map((x,i)=>({id:x.id||('topic-'+i),name:x.name||'未命名主題',slug:x.slug||slugify(x.name||('topic-'+i)),description:x.description||'',order:Number.isFinite(Number(x.order))?Number(x.order):i,active:x.active!==false}))}
function currentSiteTextPayload(){return {...DEFAULT_SITE_TEXT,...(data.siteText||{})}}
function publicBundlePayload(revision=Date.now()){
  return {
    schema:1,
    revision:Number(revision),
    publishedAt:new Date().toISOString(),
    siteText:currentSiteTextPayload(),
    topics:v11TopicPayload()

}
function publicBundleJSONText(bundle){return JSON.stringify(bundle,null,2)+'\n'}
function canonTopics(a){return JSON.stringify((a||[]).map((x,i)=>({
  id:String(x.id||('topic-'+i)),
  name:String(x.name||''),
  slug:String(x.slug||''),
  description:String(x.description||''),
  order:Number.isFinite(Number(x.order))?Number(x.order):i,
  active:x.active!==false

async function verifyPublicBundle(expected,token){
  const file=await githubRequest(
    githubContentURL(PUBLIC_BUNDLE_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
    token
  );
  let remote;
  try{remote=JSON.parse(base64Utf8(file.content||''))}catch(_){throw new Error('public-data.json 不是有效 JSON')}
  if(!remote||typeof remote!=='object')throw new Error('public-data.json 格式錯誤');
  if(Number(remote.revision)!==Number(expected.revision))throw new Error('public-data.json revision 不一致');
  if(canonTopics(remote.topics)!==canonTopics(expected.topics))throw new Error('主題內容驗證失敗');
  if(canonSiteText(remote.siteText)!==canonSiteText(expected.siteText))throw new Error('網站文字驗證失敗');
  return remote;
}
async function fetchRemotePublicBundle(token){
  try{
    const file=await githubRequest(
      githubContentURL(PUBLIC_BUNDLE_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
      token
    );
    const remote=JSON.parse(base64Utf8(file.content||''));
    return remote&&typeof remote==='object'?remote:null;
  }catch(e){
    if(/Not Found|404/i.test(e.message))return null;
    throw e;
  }
}
const PUBLIC_DATA_REVISION_KEY='signwell-public-data-revision';
function signalPublicDataRefresh(){
  try{localStorage.setItem(PUBLIC_DATA_REVISION_KEY,String(Date.now()))}catch(_){}
}
async function verifyPublishedTopics(expected,token){
  const file=await githubRequest(
    githubContentURL(V11_TOPICS_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
    token
  );
  const text=base64Utf8(file.content||'');
  let remote;
  try{remote=JSON.parse(text)}catch(_){throw new Error('GitHub 上的 topics/index.json 不是有效 JSON')}
  if(!Array.isArray(remote))throw new Error('GitHub 上的 topics/index.json 格式錯誤');
  const canon=a=>JSON.stringify((a||[]).map(x=>({
    id:String(x.id||''),name:String(x.name||''),slug:String(x.slug||''),
    description:String(x.description||''),order:Number(x.order||0),active:x.active!==false
  })));
  if(canon(remote)!==canon(expected))throw new Error('GitHub 主題檔驗證失敗：遠端內容與 CMS 不一致');

async function publishTopicsOnly(){
  if(!githubToken&&hasRememberedGithubToken())await restoreRememberedGithubToken();

  const revision=Date.now();
  const bundle=publicBundlePayload(revision);
  const topicsJSON=JSON.stringify(bundle.topics,null,2)+'\n';
  const siteJS=siteContentJSText();

  const entries=[
    {path:V11_TOPICS_PATH,mode:'100644',type:'blob',content:topicsJSON},
    {path:PUBLIC_BUNDLE_PATH,mode:'100644',type:'blob',content:publicBundleJSONText(bundle)},
    {path:PUBLIC_GITHUB.sitePath,mode:'100644',type:'blob',content:siteJS}

  await verifyPublishedTopics(bundle.topics,githubToken);

  return true;
}

syncFromGitHub=async function(){const status=$('#ghStatus'),token=currentTokenInput();if(!token){status.textContent='請先貼入或解鎖 GitHub Token。';return}githubToken=token;status.textContent='正在讀取 GitHub 正式文章與主題…';try{const remote=await v10LoadRemoteArticles(token),remoteSite=await fetchRemoteSiteText(token);let remoteTopics=[],bundle=null;try{bundle=await fetchRemotePublicBundle(token)}catch(_){}

publishGitHub=async function(){const status=$('#ghStatus'),token=currentTokenInput();if(!token){if(status)status.textContent='請先貼入或解鎖 GitHub Token。';return false}githubToken=token;if(status)status.textContent='正在準備 v10 發布資料…';let remoteIndex=[];try{remoteIndex=await v10FetchIndexRaw()}catch(_){}const alreadySynced=localStorage.getItem(SYNC_KEY)==='1';if(!alreadySynced&&remoteIndex.length){const localIds=new Set(data.articles.map(a=>a.id)),missing=remoteIndex.filter(a=>!localIds.has(a.id));if(missing.length)throw new Error(`安全阻擋：公開站有 ${missing.length} 篇文章不在這台裝置。請先按「從 GitHub 同步」。`)}

 const liveSlugs=new Set(prepared.map(v10SafeSlug));for(const old of remoteIndex){const s=old.slug;if(s&&!liveSlugs.has(s))entries.push({path:old.file||`articles/${s}.json`,mode:'100644',type:'blob',sha:null})}
 if(status)status.textContent='正在建立單一 GitHub 發布版本…';await v10BatchCommit(entries,token,'Publish SIGN WELL v10 '+new Date().toISOString().slice(0,19).replace('T',' '));

function initCmsPremium(){
