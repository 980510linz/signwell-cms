:root{--tenho:#86caff;--tenho-deep:#58a9ed;--tenho-pale:rgba(134,202,255,.20);--spring:cubic-bezier(.18,1.35,.36,1);--glass-depth:0 30px 80px rgba(55,93,126,.13),0 9px 26px rgba(55,93,126,.065),inset 0 1px 0 rgba(255,255,255,.97)}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:rgba(235,244,250,.44)}::-webkit-scrollbar-thumb{border:3px solid transparent;background:linear-gradient(180deg,#b8e5ff,#62b3ef);background-clip:padding-box;border-radius:999px}

.lock-card::before,.stat::before,.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(280px circle at var(--px) var(--py),rgba(255,255,255,.52),rgba(134,202,255,.09) 42%,transparent 68%);mix-blend-mode:screen;opacity:.65}
.stat{position:relative;overflow:hidden}.stat:hover,.panel:hover{--lift:-3px;border-color:rgba(255,255,255,.96)}
.sidebar{position:relative;overflow:hidden}.sidebar::after{content:"";position:absolute;top:-70%;left:-55%;width:34%;height:240%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.58),transparent);transform:rotate(16deg);filter:blur(4px);animation:cmsSheen 9.2s var(--ease) infinite;pointer-events:none}@keyframes cmsSheen{0%,65%{translate:-120% 0;opacity:0}72%{opacity:.85}100%{translate:650% 0;opacity:0}}
.mark{box-shadow:inset 0 1px 0 #fff,0 9px 24px rgba(88,169,237,.16)}

.publish-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:12px;margin-top:12px}.publish-card{position:relative;padding:22px;border:1px solid rgba(255,255,255,.84);border-radius:24px;background:rgba(255,255,255,.36);box-shadow:var(--glass-depth);overflow:hidden}.publish-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 0%,rgba(134,202,255,.16),transparent 36%)}.publish-card>*{position:relative;z-index:1}.publish-card h3{margin:0 0 8px;font:500 24px/1.1 Georgia,"Noto Serif TC",serif}.publish-card p{margin:0;color:#74818d;font-size:11px;line-height:1.8}.publish-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.publish-form .full{grid-column:1/-1}.publish-form label{display:grid;gap:6px;color:#7f8d99;font-size:9.5px;font-weight:700;letter-spacing:.06em}.publish-form input{height:42px;border:1px solid rgba(86,106,124,.13);border-radius:13px;background:rgba(255,255,255,.58);padding:0 12px;color:var(--ink);outline:0}.publish-form input:focus{border-color:rgba(88,169,237,.46);box-shadow:0 0 0 4px rgba(88,169,237,.08)}.publish-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.publish-status{margin-top:12px;min-height:20px;color:#6d7d8a;font-size:10.5px;line-height:1.6}.security-note{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(134,202,255,.09);border:1px solid rgba(88,169,237,.12);color:#617383;font-size:10px;line-height:1.65}.file-map{display:grid;gap:8px;margin-top:15px}.file-map div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.43);border:1px solid rgba(255,255,255,.72);font-size:10.5px}.file-map code{font-size:10px;color:#4f6f87}.file-ok{color:#558477;font-weight:750}

/* ============================================================
   SIGN WELL CMS v12.4 · Liquid editor dock
   Desktop: fixed bottom-center glass toolbar
   Mobile: bottom-right glass tool button + expandable palette
   ============================================================ */

:root{
  --editor-kb:0px;
  --editor-vv-center:50vh;
  --dock-rim:135deg;
}

/* ---------- refractive liquid toolbar ---------- */
.editor-tool-dock{
  position:fixed;
  z-index:58;
  left:50%;
  bottom:calc(max(16px,env(safe-area-inset-bottom)) + var(--editor-kb));
  transform:translateX(-50%);
  pointer-events:none;
  max-width:calc(100vw - 30px);
  isolation:isolate;
}
.editor-tool-dock .editor-toolbar{
  pointer-events:auto;
  position:relative;
  margin:0;
  padding:7px;
  width:max-content;
  max-width:min(980px,calc(100vw - 30px));
  display:flex;
  flex-wrap:nowrap;
  gap:5px;
  overflow-x:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
  border:1px solid rgba(255,255,255,.46);
  border-radius:24px;

  /* Much clearer glass — page/background remains visible through it. */
  background:
    radial-gradient(90% 180% at 18% -20%,rgba(255,255,255,.28),transparent 56%),
    linear-gradient(150deg,rgba(255,255,255,.22),rgba(226,243,254,.10) 52%,rgba(255,255,255,.16));
  -webkit-backdrop-filter:blur(14px) saturate(185%) brightness(1.07);
  backdrop-filter:blur(14px) saturate(185%) brightness(1.07);
  box-shadow:
    0 18px 50px rgba(47,78,105,.14),
    0 3px 10px rgba(47,78,105,.06),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -1px 0 rgba(79,124,160,.08);
}
.editor-tool-dock .editor-toolbar::-webkit-scrollbar{display:none}

/* Refractive edge: moving conic rim + slightly irregular lens highlights. */
.editor-tool-dock .editor-toolbar::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1.35px;
  pointer-events:none;
  z-index:4;
  background:
    conic-gradient(from var(--dock-rim) at 50% 50%,
      rgba(255,255,255,.94) 0deg,
      rgba(174,220,250,.22) 54deg,
      rgba(255,255,255,.16) 102deg,
      rgba(255,255,255,.88) 166deg,
      rgba(133,196,238,.18) 226deg,
      rgba(255,255,255,.12) 285deg,
      rgba(255,255,255,.92) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:dockRimDrift 8s ease-in-out infinite alternate;
}
.editor-tool-dock .editor-toolbar::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(100px 34px at 18% 4%,rgba(255,255,255,.44),transparent 72%),
    radial-gradient(120px 44px at 82% 104%,rgba(150,211,248,.15),transparent 76%);
  mix-blend-mode:screen;
}
@keyframes dockRimDrift{
  0%{--dock-rim:110deg}
  100%{--dock-rim:210deg}
}

.editor-tool-dock .toolbar button{
  position:relative;
  z-index:2;
  flex:0 0 auto;
  height:42px;
  min-width:42px;
  padding:0 12px;
  border-radius:14px;
  color:#587082;
  font-size:10.5px;
  font-weight:760;
  letter-spacing:.01em;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.40);
  background:
    linear-gradient(150deg,rgba(255,255,255,.25),rgba(255,255,255,.10));
  -webkit-backdrop-filter:blur(6px) saturate(150%);
  backdrop-filter:blur(6px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.50),
    0 4px 12px rgba(64,101,130,.04);
  transition:
    transform .26s var(--spring),
    background .22s ease,
    border-color .22s ease,
    box-shadow .22s ease,
    color .22s ease;
}
.editor-tool-dock .toolbar button:hover{
  transform:translateY(-1px);
  color:#315a77;
  border-color:rgba(255,255,255,.64);
  background:linear-gradient(150deg,rgba(255,255,255,.38),rgba(222,241,253,.17));
}
.editor-tool-dock .toolbar button:active{
  transform:scale(.93);
  background:rgba(205,234,252,.34);
}
.editor-tool-dock .toolbar button.active{
  color:#214f70;
  border-color:rgba(255,255,255,.72);
  background:linear-gradient(150deg,rgba(214,239,255,.48),rgba(255,255,255,.22));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 8px 20px rgba(66,116,153,.10);
}
.editor-tool-dock .tool-sep{
  position:relative;
  z-index:2;
  flex:0 0 1px;
  align-self:center;
  width:1px;
  height:23px;
  margin:0 2px;
  background:linear-gradient(transparent,rgba(75,112,142,.18),transparent);
}
.tool-fab{display:none}
.doc-editor{padding-bottom:150px!important}

/* ---------- Mobile: always live at the right center ---------- */
@media(max-width:700px){
  .editor-tool-dock{
    left:auto;
    right:max(10px,env(safe-area-inset-right));
    top:var(--editor-vv-center);
    bottom:auto;
    transform:translateY(-50%);
    max-width:none;
  }
  .tool-fab{
    pointer-events:auto;
    position:relative;
    display:grid;
    place-items:center;
    width:58px;
    height:72px;
    margin:0;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.48);
    color:#4d6a80;
    font:800 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;
    letter-spacing:-.02em;
    cursor:pointer;
    background:
      radial-gradient(80% 110% at 22% 4%,rgba(255,255,255,.38),transparent 58%),
      linear-gradient(150deg,rgba(255,255,255,.22),rgba(221,240,252,.10));
    -webkit-backdrop-filter:blur(13px) saturate(180%) brightness(1.06);
    backdrop-filter:blur(13px) saturate(180%) brightness(1.06);
    box-shadow:
      0 16px 40px rgba(48,77,103,.15),
      inset 0 1px 0 rgba(255,255,255,.60);
    transition:transform .28s var(--spring),background .22s ease;
    isolation:isolate;
  }
  .tool-fab::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1.2px;
    pointer-events:none;
    background:conic-gradient(from 130deg,
      rgba(255,255,255,.95),
      rgba(163,215,248,.18) 23%,
      rgba(255,255,255,.12) 46%,
      rgba(255,255,255,.82) 68%,
      rgba(126,190,232,.16) 84%,
      rgba(255,255,255,.95));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  .tool-fab:active{transform:scale(.91)}
  .tool-fab::after{
    content:"";
    position:absolute;
    width:7px;height:7px;
    right:9px;top:9px;
    border-radius:50%;
    background:#76b8e8;
    box-shadow:0 0 0 4px rgba(118,184,232,.11);
  }

  .editor-tool-dock .editor-toolbar{
    position:absolute;
    right:70px;
    top:50%;
    bottom:auto;
    transform:translateY(-50%) translateX(12px) scale(.95);
    transform-origin:100% 50%;
    width:min(326px,calc(100vw - 94px));
    max-width:calc(100vw - 94px);
    max-height:min(68dvh,520px);
    padding:9px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
    overflow:auto;
    border-radius:27px;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:
      opacity .20s ease,
      transform .30s var(--spring),
      visibility 0s linear .30s;
  }
  .editor-tool-dock.open .editor-toolbar{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateY(-50%) translateX(0) scale(1);
    transition-delay:0s;
  }
  .editor-tool-dock .toolbar button{
    min-width:0!important;
    width:100%;
    height:48px;
    padding:0 6px;
    border-radius:16px;
    font-size:10.5px;
  }
  .editor-tool-dock .tool-sep{display:none}
  .doc-editor{padding-bottom:92px!important;padding-right:54px!important}
}
@media(max-width:390px){
  .editor-tool-dock .editor-toolbar{
    width:min(280px,calc(100vw - 88px));
    max-width:calc(100vw - 88px);
    right:66px;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* iPhone performance: retain transparency/refraction without excessive repaint cost. */
@media(pointer:coarse){
  .editor-tool-dock .editor-toolbar,
  .tool-fab{
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    backdrop-filter:blur(10px) saturate(160%);
  }
  .editor-tool-dock .toolbar button{
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
}
body.lite .editor-tool-dock .editor-toolbar,
body.lite .tool-fab{
  -webkit-backdrop-filter:blur(7px) saturate(135%);
  backdrop-filter:blur(7px) saturate(135%);
}

/* ---------- opening multilingual welcome ---------- */
.cms-opening{
  position:fixed;inset:0;z-index:3000;
  display:grid;place-items:center;
  background:
    radial-gradient(70% 70% at 20% 10%,rgba(179,223,255,.46),transparent 60%),
    radial-gradient(70% 70% at 80% 85%,rgba(182,236,225,.34),transparent 60%),
    linear-gradient(155deg,#f8fcff,#edf5fb 52%,#e7f0f6);
  overflow:hidden;
  opacity:1;visibility:visible;
  transition:opacity .52s ease,filter .52s ease,visibility 0s linear .52s;
}
.cms-opening.out{opacity:0;filter:blur(12px);visibility:hidden;pointer-events:none}
.cms-opening::before,
.cms-opening::after{
  content:"";position:absolute;border-radius:50%;
  filter:blur(50px);opacity:.64;will-change:transform;
}
.cms-opening::before{
  width:56vmax;height:56vmax;left:-18vmax;top:-20vmax;
  background:radial-gradient(circle,rgba(114,191,250,.54),transparent 67%);
  animation:openingFlowA 4.8s ease-in-out infinite alternate;
}
.cms-opening::after{
  width:54vmax;height:54vmax;right:-18vmax;bottom:-22vmax;
  background:radial-gradient(circle,rgba(149,224,211,.38),transparent 67%);
  animation:openingFlowB 5.8s ease-in-out infinite alternate;
}
@keyframes openingFlowA{to{transform:translate3d(11%,8%,0) scale(1.08)}}
@keyframes openingFlowB{to{transform:translate3d(-10%,-7%,0) scale(.94)}}
.opening-inner{
  position:relative;z-index:2;text-align:center;
  width:min(520px,88vw);
}
.opening-word{
  min-height:1.25em;
  font:500 clamp(54px,10vw,104px)/1.08 Georgia,"Noto Serif TC","Yu Mincho",serif;
  letter-spacing:-.055em;color:#233447;
  opacity:0;transform:translateY(12px) scale(.97);filter:blur(7px);
  transition:opacity .28s ease,transform .42s cubic-bezier(.16,1,.3,1),filter .32s ease;
}
.opening-word.show{opacity:1;transform:none;filter:none}
.opening-sub{
  margin-top:15px;font-size:10px;letter-spacing:.22em;font-weight:760;color:#8091a0;
}
.opening-line{
  width:0;height:1px;margin:21px auto 0;
  background:linear-gradient(90deg,transparent,rgba(105,169,215,.52),transparent);
  animation:openingLine 1.2s cubic-bezier(.16,1,.3,1) .16s forwards;
}
@keyframes openingLine{to{width:min(260px,52vw)}}

/* ---------- login page: flowing background + clearer glass ---------- */
.lock{
  isolation:isolate;
  background:
    radial-gradient(70% 62% at 15% 10%,rgba(255,255,255,.22),transparent 68%),
    linear-gradient(155deg,rgba(244,250,255,.10),rgba(231,242,250,.04));
  overflow:hidden;
}
.lock::before,
.lock::after{
  content:"";position:absolute;pointer-events:none;z-index:0;
  border-radius:46% 54% 58% 42% / 52% 44% 56% 48%;
  filter:blur(50px) saturate(145%);
  will-change:transform,border-radius;
}
.lock::before{
  width:74vmax;height:58vmax;left:-26vmax;top:-23vmax;
  background:
    radial-gradient(circle at 40% 45%,rgba(110,192,252,.58),rgba(154,212,250,.18) 48%,transparent 72%);
  animation:loginLiquidA 12s ease-in-out infinite alternate;
}
.lock::after{
  width:68vmax;height:60vmax;right:-24vmax;bottom:-28vmax;
  background:
    radial-gradient(circle at 50% 50%,rgba(143,229,210,.43),rgba(220,191,242,.14) 54%,transparent 74%);
  animation:loginLiquidB 15s ease-in-out infinite alternate;
}
@keyframes loginLiquidA{
  0%{transform:translate3d(-3%,-2%,0) rotate(-4deg) scale(.98);border-radius:46% 54% 58% 42%/52% 44% 56% 48%}
  100%{transform:translate3d(18%,13%,0) rotate(10deg) scale(1.12);border-radius:57% 43% 40% 60%/42% 62% 38% 58%}
}
@keyframes loginLiquidB{
  0%{transform:translate3d(4%,3%,0) rotate(5deg) scale(1.04);border-radius:45% 55% 47% 53%/58% 43% 57% 42%}
  100%{transform:translate3d(-17%,-12%,0) rotate(-8deg) scale(.93);border-radius:61% 39% 55% 45%/43% 59% 41% 57%}
}

/* More transparent auth glass: background can be seen moving through it. */
.lock-card{
  border:1px solid rgba(255,255,255,.64)!important;
  background:
    radial-gradient(100% 76% at 15% 0%,rgba(255,255,255,.24),transparent 54%),
    linear-gradient(150deg,rgba(255,255,255,.16),rgba(238,248,255,.075) 52%,rgba(255,255,255,.12))!important;
  -webkit-backdrop-filter:blur(14px) saturate(175%) brightness(1.06)!important;
  backdrop-filter:blur(14px) saturate(175%) brightness(1.06)!important;
  box-shadow:
    0 32px 86px rgba(48,76,101,.14),
    0 5px 18px rgba(48,76,101,.055),
    inset 0 1px 0 rgba(255,255,255,.74),
    inset 0 -1px 0 rgba(71,112,145,.06)!important;
}
.lock-card::before{
  display:block!important;
  opacity:.58!important;
  background:
    radial-gradient(380px circle at var(--px,50%) var(--py,18%),rgba(255,255,255,.48),rgba(121,192,241,.08) 43%,transparent 68%)!important;

.lock-card::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;

  background:conic-gradient(from 130deg,
    rgba(255,255,255,.95),
    rgba(146,208,247,.16) 18%,
    rgba(255,255,255,.12) 38%,

    rgba(154,223,213,.14) 76%,

}
.lock-mark{

}
.pin{

  transition:border-color .22s ease,box-shadow .22s ease,background .22s ease,transform .24s ease;

  border-color:rgba(111,183,231,.56)!important;

}

}

.auth-back{

  border-color:rgba(255,255,255,.42)!important;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}

body.lite #lockScreen .lock-card{

  pointer-events:none;
  opacity:0;visibility:hidden;

.login-greeting.show .login-greeting-card{transform:none}
.login-greeting-word{

}
.login-greeting-word.show{opacity:1;transform:none;filter:none}
.login-greeting-small{
  margin-top:12px;font-size:9.5px;letter-spacing:.18em;font-weight:760;color:#8394a2;
}

/* ---------- confetti ---------- */
.confetti-layer{
  position:fixed;inset:0;z-index:2600;pointer-events:none;overflow:hidden;
}
.confetti-piece{
  position:absolute;
  width:var(--w,8px);height:var(--h,13px);
  left:var(--x,50vw);top:var(--y,50vh);
  border-radius:var(--r,2px);
  background:var(--c,#79bdf0);
  opacity:0;
  transform:translate3d(-50%,-50%,0) rotate(0deg) scale(.8);
  animation:confettiBurst var(--dur,1.15s) cubic-bezier(.12,.72,.12,1) var(--delay,0s) forwards;
  will-change:transform,opacity;
}
@keyframes confettiBurst{
  0%{opacity:0;transform:translate3d(-50%,-50%,0) rotate(0deg) scale(.55)}
  10%{opacity:1}
  58%{opacity:1}
  100%{
    opacity:0;
    transform:
      translate3d(calc(-50% + var(--dx)),calc(-50% + var(--dy)),0)
      rotate(var(--rot)) scale(1);
  }
}

/* ---------- reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  .cms-opening::before,.cms-opening::after,
  .lock::before,.lock::after{animation:none!important}
  .confetti-piece{display:none!important}
}
@media(max-width:620px){
  .lock{padding:18px}
  .lock-card{padding:28px 22px!important;border-radius:30px!important}
  .login-greeting-card{padding:30px 22px}
}

async function playOpeningWelcome(){
  const splash=$('#cmsOpening'),word=$('#openingWord');

  if(matchMedia('(prefers-reduced-motion:reduce)').matches){
    splash.remove();return;
  }
  const words=['哈囉','Hello','こんにちは'];
  for(let i=0;i<words.length;i++){
    word.classList.remove('show');
    await sleep(i===0?80:90);
    word.textContent=words[i];
    word.classList.add('show');
    await sleep(430);
    if(i<words.length-1){
      word.classList.remove('show');
      await sleep(120);
    }
  }
  await sleep(80);
  splash.classList.add('out');
  setTimeout(()=>splash.remove(),620);
}

function showConfetti(sourceEl=null){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const layer=$('#confettiLayer');
  if(!layer)return;

  const coarse=matchMedia('(pointer:coarse)').matches;
  const count=coarse?42:64;
  const palette=['#79bdf0','#a8d8ff','#91d7c8','#f1cf79','#e9a8c8','#ffffff'];
  const rect=sourceEl?.getBoundingClientRect?.();
  const ox=rect?rect.left+rect.width/2:innerWidth/2;
  const oy=rect?rect.top+rect.height/2:Math.min(innerHeight*.58,innerHeight-120);

  const frag=document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const p=document.createElement('i');
    p.className='confetti-piece';
    const a=(Math.PI*2)*(i/count)+(Math.random()-.5)*.16;
    const speed=(coarse?90:110)+Math.random()*(coarse?140:190);
    const dx=Math.cos(a)*speed;
    const dy=Math.sin(a)*speed + (Math.random()*110-40);
    const w=5+Math.random()*6;
    const h=7+Math.random()*10;
    p.style.setProperty('--x',ox+'px');
    p.style.setProperty('--y',oy+'px');
    p.style.setProperty('--dx',dx.toFixed(1)+'px');
    p.style.setProperty('--dy',dy.toFixed(1)+'px');
    p.style.setProperty('--rot',(180+Math.random()*720).toFixed(0)+'deg');
    p.style.setProperty('--w',w.toFixed(1)+'px');
    p.style.setProperty('--h',h.toFixed(1)+'px');
    p.style.setProperty('--r',Math.random()>.72?'50%':'2px');
    p.style.setProperty('--c',palette[i%palette.length]);
    p.style.setProperty('--dur',(0.95+Math.random()*.55).toFixed(2)+'s');
    p.style.setProperty('--delay',(Math.random()*.08).toFixed(2)+'s');
    frag.appendChild(p);
  }
  layer.appendChild(frag);
  try{navigator.vibrate?.([18,24,12])}catch(_){}
  setTimeout(()=>layer.replaceChildren(),1750);
}

function hashPin(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}

async function idbGetState(){const db=await openV10DB();return new Promise((resolve,reject)=>{const tx=db.transaction(V10_STORE,'readonly'),req=tx.objectStore(V10_STORE).get(V10_STATE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}

function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,80)||('article-'+Date.now())}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function inlineMD(s){return escapeHTML(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function markdown(md=''){const lines=md.replace(/\r/g,'').split('\n');let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};for(let i=0;i<lines.length;i++){const line=lines[i].trim();if(!line){close();continue}const c=line.match(/^> \[!(PEARL|KEY|WARNING)\]/i);if(c){close();const kind=c[1].toLowerCase(),next=(lines[++i]||'').replace(/^>\s?/,'');out+=`<div class="callout"><b>${kind==='pearl'?'Clinical Pearl':kind==='key'?'Key Point':'Warning'}</b><p>${inlineMD(next)}</p></div>`;continue}if(/^###\s+/.test(line)){close();out+=`<h3>${inlineMD(line.replace(/^###\s+/,''))}</h3>`;continue}if(/^##\s+/.test(line)){close();out+=`<h2>${inlineMD(line.replace(/^##\s+/,''))}</h2>`;continue}const ol=line.match(/^\d+\.\s+(.+)/);if(ol){if(list!=='ol'){close();list='ol';out+='<ol>'}out+=`<li>${inlineMD(ol[1])}</li>`;continue}const ul=line.match(/^[-*]\s+(.+)/);if(ul){if(list!=='ul'){close();list='ul';out+='<ul>'}out+=`<li>${inlineMD(ul[1])}</li>`;continue}close();out+=`<p>${inlineMD(line)}</p>`}close();return out}

function showAuthError(stage,message){authFailCount[stage]=(authFailCount[stage]||0)+1;const input=stage===1?$('#pinInput'):$('#answerInput'),box=$('#authError');$('#authErrorTitle').textContent=stage===1?'管理密碼不正確':'安全問題答案不正確';$('#authErrorText').textContent=message+(authFailCount[stage]>1?` · 本次已失敗 ${authFailCount[stage]} 次`:'');box?.classList.add('show');input?.classList.add('invalid');const card=$('#lockScreen .lock-card');card?.classList.remove('auth-fail');void card?.offsetWidth;card?.classList.add('auth-fail');try{navigator.vibrate?.(35)}catch(_){};setTimeout(()=>input?.classList.remove('invalid'),650);input?.select()}

function trendData(days=14){
  const an=readAnalytics(),out=[],today=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const key=d.toISOString().slice(0,10);
    out.push({key,label:`${d.getMonth()+1}/${d.getDate()}`,value:Number(an.daily[key]||0)});
  }
  return out;
}
function trendChartHTML(days=14){
  const arr=trendData(days),w=720,h=130,pad=10,max=Math.max(1,...arr.map(x=>x.value));
  const step=(w-pad*2)/Math.max(1,arr.length-1);
  const pts=arr.map((x,i)=>({
    x:pad+i*step,
    y:h-pad-(x.value/max)*(h-pad*2),
    ...x
  }));
  const line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area=`M${pad},${h-pad} ${pts.map((p,i)=>(i?'L':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')} L${w-pad},${h-pad} Z`;
  const total=readAnalytics().total;
  return `<section class="analytics-panel">
    <div class="analytics-head">
      <div><span>最近 ${days} 天</span><strong>網站觀看次數趨勢</strong></div>
      <div><span>累積頁面觀看</span><div class="analytics-total">${total.toLocaleString()}</div></div>
    </div>
    <div class="analytics-chart">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="網站觀看趨勢">
        <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc1ec" stop-opacity=".26"/><stop offset="1" stop-color="#7fc1ec" stop-opacity=".02"/></linearGradient></defs>

          <line x1="10" y1="${h*.33}" x2="${w-10}" y2="${h*.33}"/>

          <line x1="10" y1="${h-10}" x2="${w-10}" y2="${h-10}"/>
        </g>
        <path class="analytics-area" d="${area}"/>
        <path class="analytics-line" d="${line}"/>
        ${pts.filter((_,i)=>i===pts.length-1||i===0||i===Math.floor(pts.length/2)).map(p=>`<circle class="analytics-dot" cx="${p.x}" cy="${p.y}" r="3.6"><title>${p.label}：${p.value}</title></circle>`).join('')}
      </svg>
    </div>
    <div class="analytics-labels"><span>${arr[0]?.label||''}</span><span>${arr[Math.floor(arr.length/2)]?.label||''}</span><span>${arr[arr.length-1]?.label||''}</span></div>

  </section>`;
}

/* ===== SIGN WELL Storage Architecture v10 =====
   - Drafts/state: IndexedDB
   - Images: GitHub assets/uploads/YYYY/MM
   - Public list: articles/index.json
   - Full article: articles/<slug>.json
   - Legacy articles.js: compatibility fallback only
   ========================================================= */
const V10_INDEX_PATH='articles/index.json',V11_TOPICS_PATH='topics/index.json',PUBLIC_BUNDLE_PATH='public-data.json';

async function checkPublicFrontFiles(token){
  const missing=[],present=[];
  for(const path of PUBLIC_FRONT_FILES){
    try{
      await githubRequest(githubContentURL(path)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch),token);
      present.push(path);
    }catch(e){
      if(/Not Found|404/i.test(e.message))missing.push(path);
      else throw e;
    }
  }
  return {missing,present};
}
function v10Hash(s=''){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}

function v10ReadingTime(a){return Math.max(1,Math.round(v10Plain(a.content||'').replace(/\s+/g,'').length/450))}
function v10Revision(a){return v10Hash(JSON.stringify([a.title,a.slug,a.category,a.type,a.excerpt,a.tags,a.cover,a.content,a.publishedAt,a.featured,a.status]))}

function dataUrlParts(url=''){const m=String(url).match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=\s]+)$/);return m?{mime:m[1].toLowerCase(),base64:m[2].replace(/\s/g,'')}:null}
function extForMime(m=''){if(m.includes('webp'))return'webp';if(m.includes('png'))return'png';if(m.includes('gif'))return'gif';return'jpg'}
async function v10CreateBlob(base64,token){return githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/blobs`,token,{method:'POST',body:JSON.stringify({content:base64,encoding:'base64'})})}

async function v10BranchBase(token){const ref=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/ref/heads/${encodeURIComponent(PUBLIC_GITHUB.branch)}`,token),commit=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/git/commits/${ref.object.sha}`,token);return {head:ref.object.sha,tree:commit.tree.sha}}

async function v11FetchTopicsRaw(){const url=`https://raw.githubusercontent.com/${encodeURIComponent(PUBLIC_GITHUB.owner)}/${encodeURIComponent(PUBLIC_GITHUB.repo)}/${encodeURIComponent(PUBLIC_GITHUB.branch)}/${V11_TOPICS_PATH}?v=${Date.now()}`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('topics not found');const a=await r.json();if(!Array.isArray(a))throw new Error('topics invalid');return a}

    schema:1,
    revision:Number(revision),
    publishedAt:new Date().toISOString(),
    siteText:currentSiteTextPayload(),

  id:String(x.id||('topic-'+i)),

async function verifyPublicBundle(expected,token){
  const file=await githubRequest(
    githubContentURL(PUBLIC_BUNDLE_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
    token
  );
  let remote;
  try{remote=JSON.parse(base64Utf8(file.content||''))}catch(_){throw new Error('public-data.json 不是有效 JSON')}
  if(!remote||typeof remote!=='object')throw new Error('public-data.json 格式錯誤');
  if(Number(remote.revision)!==Number(expected.revision))throw new Error('public-data.json revision 不一致');
  if(canonTopics(remote.topics)!==canonTopics(expected.topics))throw new Error('主題內容驗證失敗');
  if(canonSiteText(remote.siteText)!==canonSiteText(expected.siteText))throw new Error('網站文字驗證失敗');

}
async function fetchRemotePublicBundle(token){
  try{
    const file=await githubRequest(
      githubContentURL(PUBLIC_BUNDLE_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
      token
    );
    const remote=JSON.parse(base64Utf8(file.content||''));
    return remote&&typeof remote==='object'?remote:null;
  }catch(e){
    if(/Not Found|404/i.test(e.message))return null;
    throw e;
  }
}
const PUBLIC_DATA_REVISION_KEY='signwell-public-data-revision';
function signalPublicDataRefresh(){

async function verifyPublishedTopics(expected,token){

    githubContentURL(V11_TOPICS_PATH)+'?ref='+encodeURIComponent(PUBLIC_GITHUB.branch)+'&sw='+Date.now(),
    token

  try{remote=JSON.parse(text)}catch(_){throw new Error('GitHub 上的 topics/index.json 不是有效 JSON')}
