<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#9EBFDA" />
<meta name="color-scheme" content="light" />
<title>時事新聞建議 · SIGN WELL CMS</title>
<style>
:root{
  --sky-0:#eef7ff;
  --sky-1:#d6e7f4;
  --sky-2:#aac8df;
  --sky-3:#7ea6c7;
  --ink:#102b42;
  --ink-2:#244961;
  --muted:rgba(16,43,66,.58);
  --muted-2:rgba(16,43,66,.40);
  --blue:#2f709f;
  --blue-deep:#1e587e;
  --line:rgba(255,255,255,.74);
  --line-soft:rgba(255,255,255,.48);
  --glass:rgba(255,255,255,.30);
  --glass-strong:rgba(255,255,255,.48);
  --shadow:0 26px 80px rgba(35,76,108,.16),0 8px 28px rgba(35,76,108,.08);
  --shadow-soft:0 14px 44px rgba(35,76,108,.12),0 3px 14px rgba(35,76,108,.06);
  --r-xl:34px;
  --r-lg:28px;
  --r-md:22px;
  --ease:cubic-bezier(.16,1,.3,1);
  --mx:50%;
  --my:40%;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--sky-2)}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{min-height:100dvh;overflow-x:hidden;background:
  radial-gradient(90vw 70vw at 8% -6%,rgba(255,255,255,.92),transparent 60%),
  radial-gradient(66vw 60vw at 96% 16%,rgba(179,220,249,.70),transparent 64%),
  radial-gradient(70vw 60vw at 50% 115%,rgba(71,126,169,.48),transparent 60%),
  linear-gradient(158deg,var(--sky-0) 0%,var(--sky-1) 34%,var(--sky-2) 68%,var(--sky-3) 100%);
  -webkit-tap-highlight-color:transparent;
}
button,a{font:inherit}
button{color:inherit}
a{color:inherit}

/* performance tier: preserve the glass language but reduce GPU cost */
html.lowfx .orb{filter:blur(34px);animation:none!important}
html.lowfx .glass{backdrop-filter:blur(16px) saturate(135%);-webkit-backdrop-filter:blur(16px) saturate(135%)}
html.lowfx .focus-card{transform:none!important}

.scene{position:fixed;inset:-12%;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:999px;filter:blur(58px);opacity:.85;will-change:transform}
.orb.a{width:44vmax;height:44vmax;left:-4%;top:-8%;background:radial-gradient(circle,rgba(255,255,255,.88),rgba(255,255,255,0) 68%);animation:driftA 18s ease-in-out infinite alternate}
.orb.b{width:38vmax;height:38vmax;right:-4%;top:10%;background:radial-gradient(circle,rgba(116,182,229,.64),rgba(116,182,229,0) 69%);animation:driftB 22s ease-in-out infinite alternate}
.orb.c{width:48vmax;height:48vmax;left:24%;bottom:-20%;background:radial-gradient(circle,rgba(66,117,158,.32),rgba(66,117,158,0) 67%);animation:driftC 24s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate3d(8%,6%,0) scale(1.06)}}
@keyframes driftB{to{transform:translate3d(-8%,7%,0) scale(.95)}}
@keyframes driftC{to{transform:translate3d(-6%,-4%,0) scale(1.08)}}

.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(27,64,91,.16) .45px,transparent .55px);background-size:13px 13px;mask-image:linear-gradient(to bottom,#000 0%,transparent 86%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 86%)}

.app{position:relative;z-index:2;width:min(1040px,100%);margin:0 auto;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 20px max(48px,calc(env(safe-area-inset-bottom) + 28px));}
.screen{display:none;animation:screenIn .55s var(--ease) both}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(12px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.glass{position:relative;isolation:isolate;background:
  radial-gradient(280px circle at var(--mx) var(--my),rgba(255,255,255,.34),transparent 72%),
  linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.19));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(52,93,123,.05),var(--shadow-soft);backdrop-filter:blur(28px) saturate(165%);-webkit-backdrop-filter:blur(28px) saturate(165%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:linear-gradient(135deg,rgba(176,224,255,.62),rgba(255,255,255,.92) 24%,rgba(184,241,227,.38) 44%,rgba(255,255,255,.16) 61%,rgba(235,191,255,.38) 80%,rgba(255,255,255,.75));mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude;-webkit-mask-composite:xor;opacity:.7}

/* HOME: literally one control before interaction */
#homeScreen{min-height:calc(100dvh - 66px);display:none;place-items:center}
#homeScreen.active{display:grid}
.hero-wrap{text-align:center;width:100%}
.scan-button{position:relative;overflow:hidden;min-width:min(360px,84vw);height:94px;padding:0 36px;border:0;border-radius:999px;cursor:pointer;font-size:21px;font-weight:700;letter-spacing:.02em;color:var(--ink);background:
  radial-gradient(130% 170% at 24% -40%,rgba(255,255,255,.98),rgba(255,255,255,.58) 38%,rgba(255,255,255,.25) 68%),
  rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.88);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -12px 26px rgba(68,113,146,.08),0 24px 60px rgba(35,76,108,.18),0 4px 16px rgba(35,76,108,.08);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);transition:transform .3s var(--ease),box-shadow .3s ease,opacity .2s ease;animation:floatButton 5.2s ease-in-out infinite alternate}
.scan-button:hover{transform:translateY(-3px) scale(1.01);box-shadow:inset 0 2px 0 rgba(255,255,255,1),inset 0 -12px 26px rgba(68,113,146,.08),0 30px 72px rgba(35,76,108,.21),0 6px 18px rgba(35,76,108,.1)}
.scan-button:active{transform:scale(.98)}
.scan-button:disabled{cursor:default;animation:none;opacity:.92}
.scan-button::before{content:"";position:absolute;top:-30%;left:-34%;width:36%;height:160%;transform:rotate(12deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.80),transparent);filter:blur(5px);animation:sheen 4.8s var(--ease) infinite}
.scan-button.searching::before{animation:sheen 1.25s linear infinite}
.scan-button.searching{transform:scale(.985)}
.scan-button .label{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px}
.scan-button .pulse{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(47,112,159,.25);display:none}
.scan-button.searching .pulse{display:block;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(47,112,159,0)}}
@keyframes sheen{0%,56%{transform:translateX(-80%) rotate(12deg);opacity:0}68%{opacity:1}100%{transform:translateX(440%) rotate(12deg);opacity:0}}
@keyframes floatButton{to{transform:translateY(-6px)}}
.search-note{margin:20px 0 0;font-size:13px;color:var(--muted);min-height:21px;opacity:0;transition:opacity .25s ease}
.search-note.show{opacity:1}

/* LIST */
.focus-topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px;padding:36px 2px 18px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.title{margin:0;font-size:clamp(34px,5vw,54px);font-weight:760;letter-spacing:-.055em;line-height:1}
.sub{margin:11px 0 0;max-width:60ch;font-size:13.5px;line-height:1.75;color:var(--muted)}
.icon-btn{width:44px;height:44px;border:1px solid rgba(255,255,255,.76);border-radius:999px;background:rgba(255,255,255,.30);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 10px 26px rgba(35,76,108,.10);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);transition:transform .2s var(--ease),background .2s ease}
.icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.46)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px;padding:0 2px;font-size:11.5px;color:var(--muted-2)}
.status-left{display:flex;align-items:center;gap:8px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#3da172;box-shadow:0 0 0 4px rgba(61,161,114,.10)}
.demo-badge{display:none;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);color:var(--blue-deep)}
.demo-badge.show{display:inline-flex}

.focus-list{display:grid;gap:14px}
.focus-card{--rx:0deg;--ry:0deg;position:relative;border-radius:var(--r-lg);padding:22px 22px 20px;cursor:pointer;text-align:left;width:100%;color:inherit;transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease;overflow:hidden}
.focus-card:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 58px rgba(35,76,108,.16)}
.focus-card:active{transform:perspective(1100px) scale(.99)}
.focus-card .shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--mx) var(--my),rgba(255,255,255,.42),transparent 64%);opacity:.75}
.card-grid{position:relative;z-index:2;display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:18px;align-items:start}
.index{font-size:46px;font-weight:500;letter-spacing:-.06em;line-height:.92;color:rgba(16,43,66,.22)}
.meta-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.tag{display:inline-flex;align-items:center;min-height:25px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.36);border:1px solid rgba(255,255,255,.58);font-size:11px;font-weight:750;color:var(--blue-deep)}
.when{font-size:11px;color:var(--muted-2)}
.focus-title{margin:0;font-size:19px;font-weight:720;letter-spacing:-.025em;line-height:1.45}
.focus-summary{margin:9px 0 0;font-size:13.5px;line-height:1.8;color:var(--muted);max-width:68ch}
.why{margin:9px 0 0;font-size:12px;line-height:1.7;color:var(--blue)}
.source-count{align-self:center;justify-self:end;min-width:86px;text-align:right;font-size:11px;color:var(--muted-2)}
.hot-threshold{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.58);color:var(--blue-deep);font-size:10px;font-weight:800}
.source-origin{justify-self:end;display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.52);font-size:10px;font-weight:800;color:var(--blue-deep)}
.source-origin.direct{color:#32775e;background:rgba(231,250,241,.40)}
.strict-note{margin:12px 0 0;font-size:11px;line-height:1.7;color:var(--muted-2)}
.strict-note strong{color:var(--blue-deep)}
.empty-hot{border-radius:26px;padding:28px;text-align:center}
.empty-hot strong{display:block;font-size:18px}
.empty-hot p{margin:9px auto 0;max-width:58ch;color:var(--muted);font-size:12.5px;line-height:1.75}
.chev{display:inline-grid;place-items:center;width:34px;height:34px;margin-top:8px;border-radius:999px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.44);font-size:18px;color:var(--ink-2)}

/* DETAIL */
.detail-wrap{padding-top:28px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.back-btn{flex:none}
.detail-card{border-radius:var(--r-xl);padding:28px;overflow:hidden}
.detail-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--blue);font-weight:750;letter-spacing:.02em}
.detail-title{margin:14px 0 0;font-size:clamp(30px,5vw,48px);line-height:1.16;letter-spacing:-.052em;font-weight:760;max-width:18ch}
.detail-summary{margin:18px 0 0;font-size:15px;line-height:1.95;color:var(--ink-2);max-width:70ch}
.why-panel{margin-top:22px;border-top:1px solid rgba(255,255,255,.48);padding-top:18px}
.why-label{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2)}
.why-text{margin:8px 0 0;font-size:13.5px;line-height:1.8;color:var(--blue-deep)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.68);background:rgba(255,255,255,.34);cursor:pointer;font-size:12.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 8px 20px rgba(35,76,108,.08);transition:transform .2s var(--ease),background .2s ease}
.pill:hover{transform:translateY(-1px);background:rgba(255,255,255,.5)}
.pill.primary{background:var(--ink);color:#fff;border-color:rgba(16,43,66,.28)}

.sources{margin-top:16px;display:grid;gap:10px}
.source-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:20px;padding:15px 16px;text-decoration:none;transition:transform .2s var(--ease),background .2s ease}
.source-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.42)}
.source-name{font-size:13px;font-weight:750}
.source-title{font-size:12.5px;line-height:1.55;color:var(--muted);margin-top:3px}
.source-time{font-size:10.5px;color:var(--muted-2);margin-top:4px}
.external{font-size:18px;color:var(--muted-2)}

.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px));z-index:99;transform:translate(-50%,16px);opacity:0;pointer-events:none;padding:10px 15px;border-radius:999px;background:rgba(13,34,50,.86);color:#fff;font-size:12px;box-shadow:0 12px 30px rgba(13,34,50,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.25s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.error-card{display:none;margin-top:18px;border-radius:20px;padding:14px 16px;font-size:12.5px;line-height:1.65;color:#7a3d3d;background:rgba(255,238,238,.52);border:1px solid rgba(255,255,255,.62)}
.error-card.show{display:block}

.skeleton{height:150px;border-radius:28px;overflow:hidden;position:relative;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.42)}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:loading 1.25s linear infinite}
@keyframes loading{to{transform:translateX(100%)}}

@media(max-width:720px){
  .app{padding-left:14px;padding-right:14px}
  .focus-topbar{padding-top:26px;align-items:start}
  .title{font-size:38px}
  .focus-card{padding:18px 17px}
  .card-grid{grid-template-columns:50px minmax(0,1fr);gap:12px}
  .index{font-size:34px}
  .source-count{grid-column:2;justify-self:start;text-align:left;display:flex;align-items:center;gap:8px;margin-top:0}
  .chev{width:28px;height:28px;margin:0}
  .detail-card{padding:22px 18px;border-radius:28px}
  .detail-title{font-size:34px}
}

@media(max-width:430px){
  .scan-button{min-width:84vw;height:86px;font-size:19px}
  .focus-summary{font-size:13px}
  .detail-summary{font-size:14px;line-height:1.85}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   v14.46 · SIGN WELL Medical Writing Workspace
   ============================================================ */
.workspace-section{margin-top:16px;padding:17px 18px;border-radius:22px;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.86)}
.workspace-section h3{margin:0;color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.workspace-section p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.78}
.extension-list{display:grid;gap:8px;margin-top:12px;padding:0;list-style:none}
.extension-list li{padding:11px 12px;border-radius:15px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.56);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.literature-list{display:grid;gap:9px;margin-top:12px}
.lit-card{display:block;padding:12px 13px;border-radius:16px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.56);text-decoration:none;color:inherit;transition:.2s ease}
.lit-card:hover{transform:translateY(-1px);background:rgba(255,255,255,.48)}
.lit-card strong{display:block;font-size:12.5px;line-height:1.5;color:var(--ink)}
.lit-card span{display:block;margin-top:5px;font-size:10px;color:var(--muted-2);line-height:1.45}
.lit-level{display:inline-flex!important;width:auto;margin:0 0 6px!important;padding:4px 7px;border-radius:999px;background:rgba(93,159,206,.10);color:var(--blue-deep)!important;font-size:8.5px!important;font-weight:800}
.writer-panel{margin-top:18px;padding:18px;border-radius:24px;background:radial-gradient(280px 170px at 5% 0,rgba(255,255,255,.86),transparent 72%),linear-gradient(150deg,rgba(255,255,255,.54),rgba(224,241,252,.40));border:1px solid rgba(255,255,255,.78);box-shadow:0 16px 40px rgba(46,89,121,.09),inset 0 1px 0 #fff}
.writer-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.writer-head div:first-child strong{display:block;color:var(--ink);font-size:13px}.writer-head div:first-child span{display:block;margin-top:4px;color:var(--muted-2);font-size:9.5px}
.generate-btn{border:0;border-radius:999px;padding:11px 15px;background:linear-gradient(145deg,#315f7e,#234b67);color:#fff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(37,79,107,.16)}
.generate-btn:disabled{opacity:.52;cursor:default}
.review-strip{display:none;flex-wrap:wrap;gap:7px;margin-top:13px}.review-strip.show{display:flex}
.review-chip{padding:6px 9px;border-radius:999px;background:rgba(229,248,239,.58);border:1px solid rgba(123,188,153,.20);color:#4f7d68;font-size:9px;font-weight:800}
.draft-wrap{display:none;margin-top:16px}.draft-wrap.show{display:block}
.draft-paper{padding:clamp(18px,4vw,28px);border-radius:24px;background:rgba(255,255,255,.67);border:1px solid rgba(255,255,255,.90);box-shadow:0 20px 50px rgba(47,89,120,.10),inset 0 1px 0 #fff}
.draft-paper h1{margin:0 0 20px;color:#182734;font:700 clamp(27px,5.5vw,42px)/1.12 Georgia,"Noto Serif TC",serif;letter-spacing:-.035em}
.draft-paper p{margin:0 0 15px;color:#344858;font-size:15px;line-height:1.95;letter-spacing:.015em}
.draft-paper mark{color:inherit;padding:0 .08em;background:linear-gradient(transparent 42%,rgba(255,235,116,.72) 42% 88%,transparent 88%);font-weight:730}
.draft-paper mark.core{background:linear-gradient(transparent 38%,rgba(255,218,92,.88) 38% 90%,transparent 90%);font-weight:850}
.draft-paper sup a{color:#4c7795;text-decoration:underline;text-underline-offset:2px;font-weight:750}
.draft-paper .refs{margin-top:25px;padding-top:16px;border-top:1px solid rgba(71,104,128,.12)}
.draft-paper .refs h3{margin:0 0 10px;color:#557084;font-size:11px;letter-spacing:.10em;text-transform:uppercase}
.draft-paper .refs ol{margin:0;padding-left:21px}.draft-paper .refs li{margin:8px 0;color:#617789;font-size:11.5px;line-height:1.6}
.draft-paper .refs a{color:#456b88;text-decoration:underline;text-underline-offset:3px}
.draft-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.draft-actions button{border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:10px 13px;background:rgba(255,255,255,.48);color:var(--ink-2);font-size:10.5px;font-weight:760;cursor:pointer;box-shadow:inset 0 1px 0 #fff}
.draft-actions button.primary{background:linear-gradient(145deg,#315f7e,#234b67);color:#fff;border-color:transparent}
.draft-meta{margin-top:9px;color:var(--muted-2);font-size:9.5px;line-height:1.5}

@media(max-width:430px){.actions{grid-template-columns:1fr!important}.writer-head-actions{display:grid;grid-template-columns:1fr 1fr}.generate-btn{grid-column:1/-1;width:100%!important}}
</style>

</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
</div>
<div class="noise" aria-hidden="true"></div>

<main class="app">
  <section class="screen active" id="homeScreen" aria-label="搜尋每日醫療焦點">
    <div class="hero-wrap">
      <button class="scan-button" id="scanBtn" type="button">
        <span class="label"><i class="pulse"></i><span id="scanText">開啟今日醫療焦點</span></span>
      </button>
      <p class="search-note" id="searchNote" aria-live="polite"></p><div class="warm-status" id="warmStatus"><i></i><span>登入後正在背景準備新聞、摘要與文獻…</span></div>
    </div>
  </section>

  <section class="screen" id="listScreen">
    <header class="focus-topbar">
      <div class="focus-head-copy">
        <div class="eyebrow">SIGN WELL · DAILY MEDICAL FOCUS</div>
        <h1 class="title">每日焦點</h1>
        <p class="sub">近 24 小時醫療熱門事件。至少 2 家知名媒體才列入；所有符合來源都保留，並提供摘要、延伸詞條、相關文獻與 600–800 字 SIGN WELL 範文。</p>
      </div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="重新搜尋">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
      </button>
    </header>

    <div class="status-row">
      <div class="status-left"><i class="status-dot"></i><span id="statusText">近 24 小時 · 熱門門檻 ≥ 2 家知名媒體</span></div>
      <span class="demo-badge" id="demoBadge">不使用展示資料</span>
    </div>

    <div class="focus-list" id="focusList"></div>
    <div class="error-card" id="listError"></div>
  </section>

  <section class="screen" id="detailScreen">
    <div class="detail-wrap">
      <div class="detail-head">
        <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="返回每日焦點">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>
      <article class="glass detail-card" id="detailCard"></article>
      <div class="sources" id="sourceList"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const CONFIG={hours:24,limit:5,minMajorMedia:2,requestTimeoutMs:95000};
  const lowPower=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=4)||matchMedia('(max-width:520px)').matches;
  if(lowPower)document.documentElement.classList.add('lowfx');

  const $=s=>document.querySelector(s);
  const homeScreen=$('#homeScreen'),listScreen=$('#listScreen'),detailScreen=$('#detailScreen');
  const scanBtn=$('#scanBtn'),scanText=$('#scanText'),searchNote=$('#searchNote'),warmStatus=$('#warmStatus');
  const refreshBtn=$('#refreshBtn'),backBtn=$('#backBtn'),focusList=$('#focusList'),detailCard=$('#detailCard'),sourceList=$('#sourceList'),statusText=$('#statusText'),demoBadge=$('#demoBadge'),listError=$('#listError'),toast=$('#toast');

  let topics=[],busy=false,currentTopic=null,currentDraft=null,workspacePayload=null,draftVariantCycle=0;

  function showScreen(target){[homeScreen,listScreen,detailScreen].forEach(el=>el.classList.remove('active'));target.classList.add('active');window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
  function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function safeURL(v=''){const s=String(v||'').trim();return /^https?:\/\//i.test(s)?s:'#'}
  function relTime(input){const t=new Date(input||Date.now()).getTime();if(!Number.isFinite(t))return'剛剛';const mins=Math.max(0,Math.round((Date.now()-t)/60000));if(mins<1)return'剛剛';if(mins<60)return`${mins} 分鐘前`;const h=Math.round(mins/60);return h<24?`${h} 小時前`:'24 小時內'}
  function stripHTML(html=''){const el=document.createElement('div');el.innerHTML=html;return(el.textContent||'').replace(/\s+/g,' ').trim()}
  function countZhText(html=''){return stripHTML(html).replace(/參考資料[\s\S]*$/,'').replace(/\s/g,'').length}
  function mark(text,core=false){return `<mark class="${core?'core':''}">${escapeHTML(text)}</mark>`}
  function citation(n,url){return `<sup><a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">[${n}]</a></sup>`}

  function normalizeTopics(payload){
    const raw=Array.isArray(payload)?payload:(payload?.topics||payload?.data||[]);
    return raw.map((t,i)=>{
      const sourceMap=new Map();
      (Array.isArray(t.sources)?t.sources:[]).forEach(s=>{
        const canonical=String(s.canonicalName||s.name||s.source||'').trim();
        const url=safeURL(s.originalUrl||s.url||s.link||'');
        if(s.isMajorMedia!==true||!canonical||url==='#'||sourceMap.has(canonical))return;
        sourceMap.set(canonical,{name:canonical,title:s.title||s.headline||t.title||'',url,googleNewsUrl:safeURL(s.googleNewsUrl||''),publishedAt:s.publishedAt||t.publishedAt||new Date().toISOString(),isMajorMedia:true,isDirectOriginal:s.isDirectOriginal===true,snippet:s.snippet||'',imageUrl:safeURL(s.imageUrl||''),imageCredit:s.imageCredit||canonical});
      });
      const sources=[...sourceMap.values()];
      const literature=Array.isArray(t.literature)?t.literature.map(x=>({...x,url:safeURL(x.url)})).filter(x=>x.url!=='#'):[];
      return {id:t.id||`topic-${i+1}`,title:t.title||'未命名焦點',category:t.category||'醫療時事',summary:t.summary||'',why:t.why||'',publishedAt:t.publishedAt||new Date().toISOString(),majorMediaCount:Number(t.majorMediaCount||sources.length),sources,extensionTerms:Array.isArray(t.extensionTerms)?t.extensionTerms:[],literature};
    }).filter(t=>t.majorMediaCount>=CONFIG.minMajorMedia&&t.sources.length>=CONFIG.minMajorMedia).sort((a,b)=>b.majorMediaCount-a.majorMediaCount||new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,CONFIG.limit);
  }

  async function requestWorkspace(force=false){
    if(window.parent&&window.parent!==window&&typeof window.parent.signwellMedicalNewsWorkspace==='function'){
      return window.parent.signwellMedicalNewsWorkspace({hours:24,limit:5,minMajorMedia:2,force:Boolean(force)});
    }
    if(window.parent&&window.parent!==window&&typeof window.parent.signwellMedicalNewsScan==='function'){
      return window.parent.signwellMedicalNewsScan({hours:24,limit:5,minMajorMedia:2,force:Boolean(force)});
    }
    throw new Error('請由 SIGN WELL CMS 的「時事新聞建議」分頁開啟。');
  }

  async function preloadWorkspace(){
    try{
      const data=await requestWorkspace(false);
      workspacePayload=data;topics=normalizeTopics(data);
      warmStatus.classList.add('ready');
      warmStatus.querySelector('span').textContent=topics.length?`今日時事已就緒 · ${topics.length} 個焦點`:'背景掃描完成 · 目前無符合焦點';
      scanText.textContent='開啟今日醫療焦點';
    }catch(_){
      warmStatus.classList.add('error');
      warmStatus.querySelector('span').textContent='背景準備未完成 · 點擊後重新嘗試';
    }
  }

  async function scan(force=false){
    if(busy)return;busy=true;listError.classList.remove('show');scanBtn.disabled=true;scanBtn.classList.add('searching');scanText.textContent=force?'正在重新整理':'正在開啟今日焦點';searchNote.textContent='整理近 24 小時新聞、全部知名媒體來源、延伸詞條與 PubMed 文獻…';searchNote.classList.add('show');
    try{
      const data=(!force&&workspacePayload)?workspacePayload:await Promise.race([requestWorkspace(force),new Promise((_,reject)=>setTimeout(()=>reject(new Error('背景工作逾時，請稍後再試。')),CONFIG.requestTimeoutMs))]);
      workspacePayload=data;topics=normalizeTopics(data);renderList(data);showScreen(listScreen);
    }catch(err){topics=[];focusList.innerHTML='';showScreen(listScreen);listError.textContent='無法取得即時醫療焦點：'+String(err?.message||err);listError.classList.add('show');statusText.textContent='即時工作區未完成';}
    finally{busy=false;scanBtn.disabled=false;scanBtn.classList.remove('searching');scanText.textContent='開啟今日醫療焦點';searchNote.classList.remove('show')}
  }

  function renderList(payload={}){
    demoBadge.classList.remove('show');
    const crawledAt=payload?.crawledAt?new Date(payload.crawledAt):new Date();
    const scannedCount=Number(payload?.scannedArticles||0),qualifiedCount=Number(payload?.qualifiedTopics||topics.length);
    statusText.textContent=`近 24 小時 · ${crawledAt.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 更新 · 熱門門檻 ≥ 2 家知名媒體`;
    if(!topics.length){focusList.innerHTML=`<div class="empty-hot glass"><strong>目前沒有事件通過熱門門檻</strong><p>系統不會使用展示資料，也不會降低門檻補滿 5 則。</p></div>`;return}
    focusList.innerHTML=topics.map((t,i)=>`<button class="focus-card glass" type="button" data-i="${i}"><span class="shine"></span><div class="card-grid"><div class="index">${String(i+1).padStart(2,'0')}</div><div><div class="meta-line"><span class="tag">${escapeHTML(t.category)}</span><span class="when">${relTime(t.publishedAt)}</span><span class="hot-threshold">HOT · ${t.majorMediaCount} 家知名媒體</span></div><h2 class="focus-title">${escapeHTML(t.title)}</h2><p class="focus-summary">${escapeHTML(t.summary)}</p><p class="why">${escapeHTML(t.why)}</p></div><div class="source-count"><span>${t.majorMediaCount} 家媒體</span><span class="chev">›</span></div></div></button>`).join('');
    if(qualifiedCount<CONFIG.limit)focusList.insertAdjacentHTML('beforeend',`<div class="strict-note"><strong>嚴格模式：</strong>本次掃描 ${scannedCount.toLocaleString()} 篇候選報導，只有 ${qualifiedCount} 個事件通過至少 2 家知名媒體門檻，不以低熱度內容補滿。</div>`);
    focusList.querySelectorAll('.focus-card').forEach(card=>{card.onclick=()=>openDetail(Number(card.dataset.i));if(!lowPower){card.onpointermove=e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.setProperty('--mx',`${x*100}%`);card.style.setProperty('--my',`${y*100}%`);card.style.setProperty('--ry',`${(x-.5)*3.2}deg`);card.style.setProperty('--rx',`${(.5-y)*2.8}deg`)};card.onpointerleave=()=>{card.style.setProperty('--ry','0deg');card.style.setProperty('--rx','0deg')}}});
  }

  function defaultExtensionSuggestions(t){
    const cat=t.category||'';
    const base=['原始資料或官方公告實際說了什麼？','這項資訊真正適用哪些族群，限制在哪裡？','新聞標題與研究、政策或臨床脈絡之間有沒有落差？'];
    if(/藥物/.test(cat))base.push('療效、安全性與核准適應症需要分開看哪些重點？');
    else if(/政策/.test(cat))base.push('政策改變後，病人、醫療端與資源分配會受到什麼影響？');
    else if(/公共衛生/.test(cat))base.push('個人風險與族群風險是否被新聞混在一起？');
    else base.push('這個事件對一般民眾真正可採取的行動是什麼？');
    return base;
  }

  let aiWriterStatusCache=null;

  function setAiState(mode,label){
    const el=$('#aiState');if(!el)return;
    el.className='ai-state'+(mode?' '+mode:'');
    el.textContent=label||'AI Writer';
  }

  function toggleAiSetup(show){
    const panel=$('#aiSetup');if(!panel)return;
    panel.classList.toggle('show',Boolean(show));
    if(show)setTimeout(()=>$('#aiEndpointInput')?.focus(),80);
  }

  function renderAiStatus(s){
    const note=$('#aiEngineNote');
    aiWriterStatusCache=s||null;
    if(!note)return;
    note.classList.remove('ready','error');
    if(s?.configured){
      setAiState('ready','已連線');
      note.textContent=`AI Writer 已就緒 · ${s.model||'LLM'}${s.endpointLabel?' · '+s.endpointLabel:''} · Evidence Lock 開啟${s.customPromptConfigured?' · 自訂 Prompt 已啟用':''}`;
      note.classList.add('ready');
      const model=$('#aiModelInput');if(model&&!model.value)model.value=s.model||'';
      const prompt=$('#aiPromptInput');if(prompt&&!prompt.value)prompt.value=s.customPrompt||'';
      toggleAiSetup(false);
    }else{
      setAiState('','未連線');
      const missing=Array.isArray(s?.missing)&&s.missing.length?s.missing.join('、'):'AI 後端設定';
      note.textContent=`AI Writer 尚未連線 · 缺少 ${missing}。點「AI 設定」即可在 CMS 內完成。`;
      note.classList.add('error');
    }
  }

  async function refreshAiWriterStatus({openWhenMissing=false}={}){
    try{
      if(!window.parent?.signwellMedicalNewsAIStatus)throw new Error('CMS bridge unavailable');
      setAiState('busy','檢查中');
      const s=await window.parent.signwellMedicalNewsAIStatus();
      renderAiStatus(s);
      if(openWhenMissing&&!s?.configured)toggleAiSetup(true);
      return s;
    }catch(err){
      setAiState('','狀態未知');
      const note=$('#aiEngineNote');
      if(note){note.textContent='AI Writer 狀態無法確認：'+String(err?.message||err);note.classList.remove('ready');note.classList.add('error')}
      return null;
    }
  }

  async function saveAiWriterConfig(){
    const save=$('#aiSaveBtn');
    const endpoint=$('#aiEndpointInput')?.value.trim()||'';
    const apiKey=$('#aiKeyInput')?.value.trim()||'';
    const model=$('#aiModelInput')?.value.trim()||'';
    const customPrompt=$('#aiPromptInput')?.value.trim()||'';
    if(!endpoint||!model){showToast('請填入 API Endpoint 與 Model ID');return false}
    if(!/^https:\/\//i.test(endpoint)){showToast('API Endpoint 必須使用 https://');return false}
    if(!window.parent?.signwellMedicalNewsAIConfigure){showToast('CMS 尚未載入 AI 設定 bridge');return false}
    const old=save.textContent;save.disabled=true;save.textContent='儲存並測試中…';setAiState('busy','連線測試');
    try{
      const result=await window.parent.signwellMedicalNewsAIConfigure({endpoint,apiKey,model,customPrompt,test:true});
      if(!result?.ok)throw new Error(result?.error||'AI 設定失敗');
      if($('#aiKeyInput'))$('#aiKeyInput').value='';
      renderAiStatus(result.status||result);
      toggleAiSetup(false);
      showToast('AI Writer 已連線');
      return true;
    }catch(err){
      const note=$('#aiEngineNote');const msg=String(err?.message||err);
      setAiState('','連線失敗');
      if(note){note.textContent='AI Writer 連線失敗：'+msg;note.classList.remove('ready');note.classList.add('error')}
      showToast('AI 連線失敗');
      return false;
    }finally{save.disabled=false;save.textContent=old}
  }

  function updateAiProgress(step,text,pct){
    const wrap=$('#aiProgress'),bar=$('#aiProgressBar'),label=$('#aiProgressText'),percent=$('#aiProgressPct');
    if(!wrap)return;
    wrap.classList.add('show');
    if(bar)bar.style.width=Math.max(0,Math.min(100,pct||0))+'%';
    if(label)label.textContent=text||'處理中';
    if(percent)percent.textContent=Math.round(pct||0)+'%';
    wrap.querySelectorAll('[data-ai-stage]').forEach((el,i)=>{
      el.classList.toggle('done',i<step);
      el.classList.toggle('active',i===step);
    });
  }

  function finishAiProgress(ok=true){
    updateAiProgress(5,ok?'生成完成':'生成中止',ok?100:0);
    setTimeout(()=>$('#aiProgress')?.classList.remove('show'),ok?1800:900);
  }

  function openDetail(i){
    const t=topics[i];if(!t)return;currentTopic=t;currentDraft=null;draftVariantCycle=0;
    const extensions=(t.extensionTerms?.length?t.extensionTerms:defaultExtensionSuggestions(t)).slice(0,6);
    detailCard.innerHTML=`
      <div class="detail-kicker"><span class="tag">${escapeHTML(t.category)}</span><span>${relTime(t.publishedAt)}</span><span>·</span><span>${t.majorMediaCount} 家知名媒體共同報導</span></div>
      <h1 class="detail-title">${escapeHTML(t.title)}</h1>
      <div class="workspace-section"><h3>事件摘要</h3><p>${escapeHTML(t.summary)}</p></div>
      <div class="workspace-section"><h3>延伸探討建議</h3><ul class="extension-list">${extensions.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div>
      <div class="workspace-section"><h3>相關文獻 · PubMed</h3>${renderLiterature(t)}</div>
      <div class="writer-panel">
        <div class="writer-head">
          <div><strong>SIGN WELL AI Writer</strong><span>600–800 字 · Evidence Lock · 生成後自動排版</span></div>
          <div class="writer-head-actions"><span class="ai-state" id="aiState">檢查中</span><button class="ai-settings-btn" id="aiSettingsBtn" type="button">AI 設定</button><button class="generate-btn" id="generateDraftBtn" type="button">AI 一鍵生成範文</button></div>
        </div>
        <div class="ai-setup" id="aiSetup">
          <div class="ai-setup-title"><div><strong>連線 AI Writer</strong><span>設定一次即可。API Key 只寫入 Google Apps Script 的 Script Properties，不會由狀態 API 回傳。</span></div></div>
          <div class="ai-grid">
            <div class="ai-field"><label for="aiEndpointInput">API ENDPOINT</label><input id="aiEndpointInput" type="url" inputmode="url" autocomplete="off" placeholder="https://…"></div>
            <div class="ai-field"><label for="aiModelInput">MODEL ID</label><input id="aiModelInput" type="text" autocomplete="off" placeholder="模型 ID"></div>
            <div class="ai-field key"><label for="aiKeyInput">API KEY</label><input id="aiKeyInput" type="password" autocomplete="new-password" placeholder="貼上金鑰；已設定時可留空保留原金鑰"></div>
            <div class="ai-field prompt"><label for="aiPromptInput">自訂寫作 PROMPT · 可留空</label><textarea id="aiPromptInput" maxlength="6000" placeholder="例如：語氣冷靜、像臨床醫師寫給一般讀者；避免五段式；先交代臨床意義，再談研究限制；不要使用「值得注意的是」等套話。"></textarea><div class="ai-prompt-help"><span>只控制語氣、角度與敘事偏好；<strong>不能覆蓋 Evidence Lock 與 600–800 字限制。</strong></span><span>最多 6000 字</span></div></div>
          </div>
          <div class="ai-setup-actions"><button class="ai-save-btn" id="aiSaveBtn" type="button">儲存並測試</button><button class="ai-cancel-btn" id="aiCancelBtn" type="button">取消</button><span class="ai-privacy">設定會儲存在後端，不寫入 GitHub。</span></div>
        </div>
        <div class="ai-progress" id="aiProgress">
          <div class="ai-progress-head"><span id="aiProgressText">準備生成</span><span id="aiProgressPct">0%</span></div>
          <div class="ai-progress-track"><div class="ai-progress-bar" id="aiProgressBar"></div></div>
          <div class="ai-stages"><span class="ai-stage" data-ai-stage="0">新聞來源鎖定</span><span class="ai-stage" data-ai-stage="1">PubMed 核驗</span><span class="ai-stage" data-ai-stage="2">AI 撰寫</span><span class="ai-stage" data-ai-stage="3">Evidence Audit</span><span class="ai-stage" data-ai-stage="4">自動排版</span></div>
        </div>
        <div class="review-strip" id="reviewStrip"><span class="review-chip">Sources ✓</span><span class="review-chip">PubMed Verified ✓</span><span class="review-chip">Medical ✓</span><span class="review-chip">Regulatory ✓</span><span class="review-chip">Plain Language ✓</span></div>
        <div class="draft-wrap" id="draftWrap"><div class="draft-paper" id="draftPaper"></div><div class="draft-actions"><button id="copyDraftBtn" type="button">複製範文</button><button class="primary" id="toEditorBtn" type="button">帶入文章編輯器</button><button id="publishDraftBtn" type="button">直接發布＋通知到「時事探討」</button></div><div class="draft-meta" id="draftMeta"></div></div>
        <div class="engine-note" id="aiEngineNote">正在確認 AI Writer 後端狀態…</div>
      </div>
      <div class="actions"><button class="pill primary" id="copyFocusBtn" type="button">複製焦點摘要</button><button class="pill" id="copyLinksBtn" type="button">複製全部原文</button></div>`;

    sourceList.innerHTML=`<div class="why-panel"><div class="why-label">SOURCE CHECK</div><p class="why-text">${escapeHTML(t.why)}</p></div>`+t.sources.map((s,idx)=>`<a class="source-card glass" href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer"><div><div class="source-name">[${idx+1}] ${escapeHTML(s.name)}</div><div class="source-title">${escapeHTML(s.title)}</div><div class="source-time">${relTime(s.publishedAt)}</div></div><span class="source-origin ${s.isDirectOriginal?'direct':''}">${s.isDirectOriginal?'原文':'原文入口'} ↗</span></a>`).join('');

    $('#copyFocusBtn').onclick=()=>copyText(`${t.title}\n\n${t.summary}\n\n熱門度：${t.majorMediaCount} 家知名媒體共同報導\n${t.why}`);
    $('#copyLinksBtn').onclick=()=>copyText(t.sources.map(s=>`${s.name}｜${s.title}\n${s.url}`).join('\n\n'));
    $('#generateDraftBtn').onclick=()=>generateDraft(t);
    $('#aiSettingsBtn').onclick=()=>toggleAiSetup(!$('#aiSetup').classList.contains('show'));
    $('#aiCancelBtn').onclick=()=>toggleAiSetup(false);
    $('#aiSaveBtn').onclick=saveAiWriterConfig;
    showScreen(detailScreen);
    refreshAiWriterStatus({openWhenMissing:false});
  }

  function renderLiterature(t){
    if(!t.literature?.length)return `<p>目前未取得足夠精準的 PubMed 結果。系統不會自行捏造文獻；仍可依上方延伸詞條人工查證。</p>`;
    return `<div class="literature-list">${t.literature.map((x,i)=>`<a class="lit-card" href="${escapeHTML(x.url)}" target="_blank" rel="noopener noreferrer"><span class="lit-level">${escapeHTML(x.evidenceLevel||'Research Article')}</span><strong>[L${i+1}] ${escapeHTML(x.title||'Untitled')}</strong><span>${escapeHTML([x.journal,x.pubdate].filter(Boolean).join(' · '))}${x.pmid?` · PMID ${escapeHTML(x.pmid)}`:''}</span></a>`).join('')}</div>`;
  }

  function narrativeVariant(t,offset=0){
    let h=0;
    for(const ch of String(t.id||t.title))h=(h*31+ch.charCodeAt(0))>>>0;
    return (h+Number(offset||0))%4;
  }

  function guardrailText(text){
    return String(text||'')
      .replace(/最有效/g,'目前證據較受關注的')
      .replace(/完全安全/g,'目前資料顯示具有一定安全性，但仍需評估風險')
      .replace(/零風險/g,'風險並非為零')
      .replace(/保證/g,'無法保證')
      .replace(/一定會/g,'可能會')
      .replace(/證實可以/g,'研究顯示可能')
      .replace(/根治/g,'治療')
      .replace(/治癒所有/g,'改善部分');
  }

  function buildReferences(t){
    const refs=[];
    t.sources.forEach(s=>refs.push({type:'news',name:s.name,title:s.title,url:s.url}));
    (t.literature||[]).forEach(x=>refs.push({type:'literature',name:x.journal||'PubMed',title:x.title,url:x.url,pmid:x.pmid,evidenceLevel:x.evidenceLevel}));
    return refs;
  }

  function refListHTML(refs){
    return `<div class="refs"><h3>參考資料</h3><ol>${refs.map((r,i)=>`<li id="ref-${i+1}"><a href="${escapeHTML(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(r.type==='news'?`${r.name}｜${r.title}`:`${r.title}｜${r.name}${r.pmid?`｜PMID ${r.pmid}`:''}`)}</a></li>`).join('')}</ol></div>`;
  }

  function compactText(v='',max=170){
    const s=String(v||'').replace(/\s+/g,' ').trim();
    return s.length>max?s.slice(0,max).replace(/[，、；：,.!?！？。]+$/,'')+'…':s;
  }

  function naturalArticleSummary(t){
    let s=String(t.summary||'').replace(/\s+/g,' ').trim();

    /* These are cleanup rules only; none of this process language is inserted into article output. */
    s=s
      .replace(/近\s*24\s*小時共有\s*\d+\s*家知名媒體集中報導[^。]*。?/g,'')
      .replace(/近\s*24\s*小時[^。]*。?/g,'')
      .replace(/多家媒體標題共同出現的焦點包括[^。]*。?/g,'')
      .replace(/其他來源對同一事件的標題焦點還包括[^。]*。?/g,'')
      .replace(/這段摘要依[^。]*。?/g,'')
      .replace(/這段整理依[^。]*。?/g,'')
      .replace(/主要來源包含[^。]*。?/g,'')
      .replace(/熱門門檻[^。]*。?/g,'')
      .replace(/Google\s*News\s*RSS/ig,'')
      .replace(/\bRSS\b/ig,'')
      .replace(/系統以延伸詞條查到/ig,'')
      .replace(/\s+/g,' ')
      .trim();

    if(s.length>=32)return compactText(s,210);

    const snippets=(t.sources||[])
      .map(x=>String(x.snippet||'').replace(/\s+/g,' ').trim())
      .filter(x=>x.length>=32);
    if(snippets.length)return compactText(snippets[0],210);

    return compactText(t.title||'',160);
  }

  function sourceImageFigure(t){
    const source=(t.sources||[]).find(s=>/^https?:\/\//i.test(String(s.imageUrl||'')));
    if(!source)return '';
    const image=escapeHTML(source.imageUrl);
    const link=escapeHTML(source.url||'#');
    const credit=escapeHTML(source.imageCredit||source.name||'原始來源');
    return `<figure class="sw-source-figure"><a href="${link}" target="_blank" rel="noopener noreferrer"><img src="${image}" alt="與本文主題相關的新聞圖片" loading="lazy" decoding="async"></a><figcaption>圖片來源：<a href="${link}" target="_blank" rel="noopener noreferrer">${credit}</a>｜原始報導</figcaption></figure>`;
  }

  function section(title,html){
    return `<h2 class="sw-section-title">${escapeHTML(title)}</h2><p>${guardrailText(html)}</p>`;
  }

  function buildDraft(t,variantOffset=0){
    const refs=buildReferences(t);
    const src=t.sources||[];
    const first=src[0]||{url:'#',name:'來源'};
    const second=src[1]||first;
    const lit=t.literature?.[0];
    const c1=citation(1,first.url);
    const c2=citation(Math.min(2,Math.max(1,refs.length)),second.url);
    const litIndex=lit?src.length+1:0;
    const clit=lit?citation(litIndex,lit.url):'';

    const titleRaw=compactText(t.title,66);
    const summary=naturalArticleSummary(t);
    const extensions=(t.extensionTerms?.length?t.extensionTerms:defaultExtensionSuggestions(t))
      .map(x=>compactText(x,48)).filter(Boolean).slice(0,3);
    const variant=narrativeVariant(t,variantOffset);

    const titles=[
      `${titleRaw}：真正需要看懂的是什麼？`,
      `${titleRaw}，別只停在第一個答案`,
      `${titleRaw}：從資訊到醫療判斷，中間還差幾步`,
      `${titleRaw}之後，更值得問的幾個問題`
    ];
    const title=compactText(titles[variant],76);

    const openingHooks=[
      `${mark('醫療資訊最容易被忽略的，往往不是答案，而是答案成立的條件。',true)}「${escapeHTML(titleRaw)}」看似是一個可以快速下結論的題目，但真正要看懂它，還得把事件本身、證據強度和適用對象分開。${c1}`,
      `${mark('一句很有力的結論，常常少了最重要的那半句：它對誰成立？',true)}「${escapeHTML(titleRaw)}」值得關注的地方，不只是結果本身，而是背後有哪些條件、限制與尚未回答的問題。${c1}${c2}`,
      `${mark('如果只記住標題，最容易漏掉的就是醫療判斷真正需要的上下文。',true)}「${escapeHTML(titleRaw)}」可以從幾個層次來看：先把發生的事說清楚，再看研究或政策能支持到哪裡，最後才談它和個人有沒有關係。${c1}`,
      `${mark('同一個醫療議題，只要換了族群、研究設計或政策條件，答案就可能不一樣。',true)}「${escapeHTML(titleRaw)}」正好提醒我們，好的健康資訊不是把事情說得更肯定，而是把重要條件交代完整。${c1}`
    ];

    const eventText =
      `${escapeHTML(summary)}${c2} `+
      `${mark('先把「發生了什麼」和「代表什麼」分開，判讀會清楚很多。')}`+
      `事件本身可以是新的研究結果、政策變化、監管決定或臨床進展；它的重要性，還要看原始資料究竟回答了哪一個問題，而不是直接把消息延伸成個人的治療結論。`;

    const conditionText =
      `${mark('真正影響結論的，通常藏在適用條件裡。',true)}`+
      `研究納入的是哪些人、追蹤多久、比較的是什麼，政策又適用哪些資格，都會改變一句話可以說到多遠。`+
      `對一般讀者而言，與其先問「這是不是更好」，不如先確認自己的情況是否和資料中的族群接近。`;

    const evidenceText = lit
      ? `延伸到研究證據，PubMed 收錄的「${escapeHTML(compactText(lit.title,112))}」可以作為理解這個議題的背景資料。${clit}`+
        `${mark('相關研究可以補足脈絡，但不能因為題目相近，就把它直接當成同一件事的證明。')}`+
        `閱讀時仍要看研究設計、樣本、比較組與終點，尤其不能把相關性寫成因果，也不能把特定族群的結果直接套用到所有人。`
      : `${mark('沒有足夠精準的研究可以對應時，最好的做法不是補上一個看似完整的答案。',true)}`+
        `這種情況下，文章應把已知資訊和仍待確認的部分分開，只談來源能支持的內容，不自行加上療效、風險或治療建議。`;

    const extensionText =
      extensions.length
      ? `${mark('把問題再往下追，會比只記住一個結論更有價值。')}`+
        `這個題目可以繼續從${escapeHTML(extensions.join('、'))}幾個方向理解。`+
        `如果後續資料出現不同結果，也應回到原始研究或官方文件，確認差異來自研究族群、方法、追蹤時間，還是真正出現了新的證據。`
      : `${mark('真正值得延伸的，是那些會改變判斷的條件。')}`+
        `包括適用族群、研究方法、療效大小、安全性與替代方案。把這些問題補齊，往往比單獨記住一個數字更接近臨床上的真實決策。`;

    const practicalText =
      `${mark('對一般人來說，重要的不是立刻採取行動，而是知道這個資訊和自己有沒有直接關係。',true)}`+
      `如果內容涉及藥物、療程或醫療器材，是否需要調整治療仍應放回個人的疾病背景、用藥、風險與醫療目標一起評估。`+
      `新聞或研究可以提供新的問題，但不應取代個別診療。`;

    const closeText =
      `把這類醫療議題看懂，其實不需要記住所有專有名詞。先確認資料在說誰、比較什麼、結果有多大，再看限制與可能風險，就已經能避開很多常見誤解。`+
      `${mark('好的醫療科普，不是把話說得最滿，而是讓讀者知道一個結論能相信到哪裡。',true)}`;

    const headings=[
      ['先把事情本身說清楚','答案成立，需要哪些條件？','研究證據能告訴我們多少？','還有哪些問題值得往下追？','對一般人最實際的意義'],
      ['先看核心資訊','別漏掉適用條件','把研究放回原本的位置','再往下追三個方向','最後回到自己的情況'],
      ['這件事真正改變了什麼？','誰適用，差別很大','證據強度比標題更重要','值得繼續追的問題','怎麼把資訊用在自己身上'],
      ['先理解事件，不急著下結論','條件不同，答案也會不同','研究能支持到哪裡？','從這裡再多問一步','真正需要帶走的是什麼']
    ][variant];

    const blocks=[
      section(headings[0],eventText),
      section(headings[1],conditionText),
      section(headings[2],evidenceText),
      section(headings[3],extensionText),
      section(headings[4],practicalText)
    ];

    const orders=[
      [0,1,2,3,4],
      [0,3,1,2,4],
      [0,2,1,3,4],
      [0,1,3,2,4]
    ];

    const opening=`<p>${guardrailText(openingHooks[variant])}</p>`;
    const figure=sourceImageFigure(t);
    let body=opening;
    orders[variant].forEach((idx,pos)=>{
      body+=blocks[idx];
      if(pos===0&&figure)body+=figure;
    });
    body+=`<p>${guardrailText(closeText)}</p>`;

    let plain=countZhText(body);

    const supplements=[
      section('數字要怎麼看才不會被誤導？',
        `${mark('一個百分比如果少了基準值、追蹤時間和研究族群，很容易被理解成另一件事。')}`+
        `看到風險增加、效果提升或平均下降時，最好一起確認原本的發生率、實際差距，以及這個差距對生活或健康是否具有臨床意義。`),
      section('來源很多，就代表證據更強嗎？',
        `${mark('不同媒體同時引用同一份研究，並不等於有很多份獨立證據。')}`+
        `來源數量可以幫助我們知道議題受到關注，但醫療結論的強弱，仍取決於原始研究設計與資料品質。`)
    ];

    let si=0;
    while(plain<600&&si<supplements.length){
      body+=supplements[si++];
      plain=countZhText(body);
    }

    const refsHtml=refListHTML(refs);
    const preview=`<h1>${escapeHTML(title)}</h1>${body}${refsHtml}`;
    const imgSource=(t.sources||[]).find(s=>/^https?:\/\//i.test(String(s.imageUrl||'')))||null;
    return {
      title,
      excerpt:stripHTML(summary).slice(0,180),
      content:body+refsHtml,
      preview,
      references:refs,
      wordCount:countZhText(body),
      tags:[t.category,...(t.extensionTerms||[]).slice(0,4)],
      sources:t.sources,
      publisherName:'SignWell·欣緯生醫',
      imageSource:imgSource?{imageUrl:imgSource.imageUrl,credit:imgSource.imageCredit||imgSource.name||''}:null
    };
  }

  function bindDraftMediaFallback(){
    document.querySelectorAll('#draftPaper .sw-source-figure img').forEach(img=>{
      const drop=()=>img.closest('.sw-source-figure')?.remove();
      img.addEventListener('error',drop,{once:true});
      if(img.complete && !img.naturalWidth)drop();
    });
  }

  async function generateDraft(t){
    const btn=$('#generateDraftBtn');
    const note=$('#aiEngineNote');
    if(!btn)return;

    let status=aiWriterStatusCache;
    if(!status?.configured)status=await refreshAiWriterStatus({openWhenMissing:true});
    if(!status?.configured){
      showToast('先完成一次 AI Writer 設定');
      return;
    }

    btn.disabled=true;
    btn.textContent='AI 正在生成…';
    setAiState('busy','生成中');
    if(note){note.classList.remove('error');note.textContent='正在鎖定新聞來源、重新核驗 PubMed，並執行兩階段醫療編輯…'}
    updateAiProgress(0,'鎖定已取得的新聞來源',12);

    const timers=[
      setTimeout(()=>updateAiProgress(1,'後端核驗 PubMed 文獻',30),700),
      setTimeout(()=>updateAiProgress(2,'AI 撰寫 600–800 字初稿',54),1800),
      setTimeout(()=>updateAiProgress(3,'Medical Editor + Evidence Audit',78),4200),
      setTimeout(()=>updateAiProgress(4,'自動加上螢光重點與中標題格式',92),6200)
    ];

    try{
      if(!window.parent?.signwellMedicalNewsGenerateAIArticle){
        throw new Error('目前 CMS 尚未載入 AI Writer bridge。');
      }

      const result=await window.parent.signwellMedicalNewsGenerateAIArticle(
        t,
        {variation:draftVariantCycle++}
      );

      if(result?.aiConfigured===false){
        aiWriterStatusCache=null;
        const missing=Array.isArray(result.missing)?result.missing.join('、'):'AI 後端設定';
        toggleAiSetup(true);
        throw new Error(`AI Writer 尚未設定：${missing}`);
      }
      if(!result?.ok||!result?.article){
        throw new Error(result?.error||'AI Writer 沒有產生可用文章');
      }

      currentDraft=result.article;
      $('#draftPaper').innerHTML=currentDraft.preview;
      bindDraftMediaFallback();
      $('#reviewStrip').classList.add('show');
      $('#draftWrap').classList.add('show');

      const audit=result.audit||currentDraft.audit||{};
      const verified=Number(audit.verifiedLiteratureCount||0);
      const cited=Number(audit.citedLiteratureCount||0);
      $('#draftMeta').textContent=
        `${currentDraft.wordCount} 字 · `+
        `${currentDraft.sources?.length||0} 個新聞來源 · `+
        `${verified} 篇 PubMed 後端核驗文獻 · `+
        `${cited} 篇實際引用 · Evidence Lock PASS`;

      if(note){
        note.textContent=
          `Evidence Lock 通過 · PubMed metadata 由 Backend 核驗 · `+
          `模型不能自行建立文獻 metadata 或網址${audit.twoPassEditor?' · 已完成兩階段醫療編輯':''}${audit.formattingAppliedAfterGeneration?' · 螢光與中標題由後端生成後套用':''}`;
        note.classList.remove('error');note.classList.add('ready');
      }

      $('#copyDraftBtn').onclick=()=>copyDraft(currentDraft);
      $('#toEditorBtn').onclick=()=>sendArticle('editor');
      $('#publishDraftBtn').onclick=()=>sendArticle('publish');
      btn.textContent='重新生成另一種敘事';
      setAiState('ready','已完成');
      finishAiProgress(true);
    }catch(err){
      const msg=String(err?.message||err);
      showToast(msg);
      if(note){note.textContent=msg;note.classList.remove('ready');note.classList.add('error')}
      btn.textContent=currentDraft?'重新生成另一種敘事':'AI 一鍵生成範文';
      setAiState('','生成失敗');
      finishAiProgress(false);
    }finally{
      timers.forEach(clearTimeout);
      btn.disabled=false;
    }
  }

  async function copyDraft(d){
    const plain=`${d.title}\n\n${stripHTML(d.content).replace(/參考資料/g,'\n\n參考資料\n')}`;
    const rich=`<h1>${escapeHTML(d.title)}</h1>${d.content}`;
    try{
      if(window.ClipboardItem&&navigator.clipboard?.write){
        await navigator.clipboard.write([new ClipboardItem({
          'text/plain':new Blob([plain],{type:'text/plain'}),
          'text/html':new Blob([rich],{type:'text/html'})
        })]);
      }else{
        await navigator.clipboard.writeText(plain);
      }
    }catch{await copyText(plain);return}
    showToast('範文已複製');
  }

  async function sendArticle(mode){
    if(!currentDraft||!currentTopic)return;
    if(!window.parent||window.parent===window||typeof window.parent.signwellMedicalNewsCreateArticle!=='function'){showToast('請由 SIGN WELL CMS 操作');return}
    const btn=mode==='publish'?$('#publishDraftBtn'):$('#toEditorBtn');
    const old=btn.textContent;btn.disabled=true;btn.textContent=mode==='publish'?'正在發布…':'正在帶入…';
    try{
      const res=await window.parent.signwellMedicalNewsCreateArticle({title:currentDraft.title,excerpt:currentDraft.excerpt,content:currentDraft.content,references:currentDraft.references,tags:currentDraft.tags,topicId:currentTopic.id,sources:currentTopic.sources},mode);
      if(res?.cancelled){btn.disabled=false;btn.textContent=old;return}
      if(res?.ok&&mode==='publish'){
        const n=res.notification||{};
        if(n.enabled===false)showToast('已發布 · 自動訂閱通知目前關閉');
        else if(n.skipped)showToast('已發布 · 目前沒有可寄送訂閱者');
        else if(n.alreadySent)showToast('已發布 · 此文章通知先前已寄送');
        else if(n.success)showToast(`已發布並通知 ${Number(n.delivered||0).toLocaleString()} 位訂閱者`);
        else showToast('已發布 · 訂閱通知未完成');
      }
      else if(res?.needsGithub)showToast('已保留草稿 · 請先解鎖 GitHub Token');
    }catch(err){showToast('操作失敗：'+String(err?.message||err))}
    finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent=old}}
  }

  async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}showToast('已複製')}
  let toastTimer;function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}

  scanBtn.onclick=()=>scan(false);
  refreshBtn.onclick=()=>{workspacePayload=null;showScreen(homeScreen);setTimeout(()=>scan(true),180)};
  backBtn.onclick=()=>showScreen(listScreen);
  window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='SIGNWELL_MEDICAL_WORKSPACE_READY'&&!workspacePayload)preloadWorkspace()});
  preloadWorkspace();

  document.addEventListener('visibilitychange',()=>{
    document.body.classList.toggle('sw-page-hidden',document.hidden);
  },{passive:true});

})();
</script>
